e plugin's base URL is set to Token Buffet's OpenAI-compatible endpoint at http://127.0.0.1:8090/v1, with the target model set to one of Token Buffet's abstract semantic performance tiers.\n\n### 2. Logseq: AI-Assisted Outlining & Knowledge Synthesis\n\nLogseq is a privacy-first, open-source outliner and knowledge-management application. It integrates AI capabilities directly into block-based outliner workflows:\n\n* **Plugins & Extensions**: Connects via plugins such as logseq-copilot or third-party local AI integration plugins.\n* **Core Capabilities**: Delivers block-level writing assistance, document summarization, note chat, and automated concept synthesis directly within structured outline nodes.\n* **Connection Endpoint**: The plugin setting points to Token Buffet's Ollama or OpenAI-compatible endpoint at http://127.0.0.1:8090/v1.\n\n### 3. The Universal Configuration Rule & Delivery Model\n\nBoth Joplin and Logseq connect to Token Buffet seamlessly by adhering to the platform's Universal Configuration Rule for routable applications:\n\n* **Endpoint**: Set the plugin's base URL / server host to http://127.0.0.1:8090 (for Ollama host formats) or http://127.0.0.1:8090/v1 (for OpenAI-compatible formats).\n* **Model Name**: Select an abstract semantic model tier—fast (Quick), medium (Balanced), or reasoning (Best). The local router populates dropdowns cleanly via /v1/models or /api/tags and dispatches prompts based on available quota headroom or user preferences.\n* **API Key**: Use any dummy placeholder string (e.g., ollama).\n\nDelivery Tier Classification\n\nToken Buffet categorizes consumer app delivery into three implementation tiers based on development effort and value:\n\n* **Delivery Tier A (Lowest Effort)**: Re-pointing an endpoint field in an existing, routable third-party app.\n* **Delivery Tier B (Thin Friendly Integration)**: Building a lightweight local script or bot where no native consumer app exists.\n* **Delivery Tier C (Cloud-Locked)**: Documenting non-routable tools to set clear user expectations.\n\nBoth Joplin and Logseq belong to Delivery Tier A, requiring zero custom code creation—simply re-pointing the plugin's API base URL field to port 8090.\n\n### 4. Position on the Consumer Routing Roadmap\n\nWithin Token Buffet's strategic roadmap for non-technical users, Joplin and Logseq fulfill a distinct role:\n\n* **Roadmap Rankings**: On the Top 10 consumer routable targets list, Joplin is ranked #5 and Logseq is ranked #6, both earning a ★★ fit rating.\n* **Strategic Value**: They are positioned #4 in the recommended integration priority sequence (following #1 Obsidian, #2 Brave Browser Leo, and #3 Home Assistant).\n* **Rounding Out the Notes Story**: Their primary strategic purpose is to \"round out the notes story for non-Obsidian users\". By supporting Joplin and Logseq alongside Obsidian, Token Buffet ensures that users across different note-taking paradigms (standard markdown notebooks, outliners, and Karpathy-style wikis) can leverage flat-rate subscription AI quotas across their personal knowledge bases."};

    if (!w) return;
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    w.document.write('<!doctype html><meta charset="utf-8"><title>' + esc(pTitle.textContent) + '</title>' +
      '<style>body{margin:0;padding:32px 40px;background:#191c24;color:#c4ccda;font:16px/1.7 system-ui,sans-serif}' +
      'h1{color:#eef1f7;font-size:26px}.k{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#9aa4b6}' +
      'code{background:#2f3644;color:#c7b8ff;padding:1px 6px;border-radius:5px}a{color:#8fa3c4}' +
      'h2,h3,h4{color:#eef1f7}table{border-collapse:collapse}th,td{border:1px solid #333a49;padding:5px 9px}' +
      'blockquote{margin:0;padding-left:14px;border-left:3px solid #333a49;color:#9aa4b6}</style>' +
      '<p class="k">' + esc(pKick.textContent) + '</p><h1>' + esc(pTitle.textContent) + '</h1>' + pDesc.innerHTML);
    w.document.close();
  });

  // --- Search: filter node labels, reveal + deep-link the chosen node ---
  // Index every node once (id, label, lowercased label, branch label for context). Reuses
  // the existing revealAndSelect (unfold ancestors + select + frame) and pushHash (update
  // the URL to the node's #slug) so a search hit behaves exactly like a clicked/linked node.
  const SEARCH_INDEX = Object.keys(LABELS).map(id => ({
    id, label: LABELS[id],
    lower: LABELS[id].toLowerCase(),
    branch: (META[id] && META[id].b) || '',
    key: (META[id] && META[id].k) || 'navy',
    plain: (DESC[id] || '').replace(/[#>*_`|]/g, ' ').replace(/\s+/g, ' ').trim(),
  }));
  SEARCH_INDEX.forEach(n => { n.plainLower = n.plain.toLowerCase(); });
  let searchMode = 'concepts';   // 'concepts' (names) or 'content' (description text)
  const SEARCH_MAX = 25;

  const searchWrap = document.getElementById('search');
  const searchInput = document.getElementById('search-input');
  const searchClear = document.getElementById('search-clear');
  const searchResults = document.getElementById('search-results');
  let searchMatches = [];
  let searchActive = -1;

  // Escape a user query for safe use inside a RegExp (highlighting the matched span).
  function reEscape(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  // Escape text for safe HTML injection into a result row.
  function htmlEscape(s){
    return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }
  // Bold the matched substring within a label (case-insensitive), HTML-escaped.
  function highlight(label, q){
    const i = label.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return htmlEscape(label);
    return htmlEscape(label.slice(0, i)) + '<mark>' +
      htmlEscape(label.slice(i, i + q.length)) + '</mark>' + htmlEscape(label.slice(i + q.length));
  }

  // A highlighted excerpt of the description around the first match.
  function snippet(n, q){
    const i = n.plainLower.indexOf(q.toLowerCase());
    const start = Math.max(0, i - 30);
    const text = (start ? '…' : '') + n.plain.slice(start, start + 90 + q.length);
    return highlight(text, q);
  }

  function runSearch(q){
    q = q.trim();
    searchWrap.classList.toggle('has-text', q.length > 0);
    if (!q){ closeSearch(); return; }
    const ql = q.toLowerCase();
    if (searchMode === 'content'){
      searchMatches = SEARCH_INDEX
        .filter(n => n.plainLower.includes(ql))
        .sort((a, b) => a.plainLower.indexOf(ql) - b.plainLower.indexOf(ql))
        .slice(0, SEARCH_MAX);
      searchActive = searchMatches.length ? 0 : -1;
      renderSearch(q);
      searchWrap.classList.add('open');
      return;
    }
    // Rank: label starts with query first, then earliest match position, then shorter label.
    searchMatches = SEARCH_INDEX
      .filter(n => n.lower.includes(ql))
      .sort((a, b) => {
        const sa = a.lower.startsWith(ql), sb = b.lower.startsWith(ql);
        if (sa !== sb) return sa ? -1 : 1;
        const pa = a.lower.indexOf(ql), pb = b.lower.indexOf(ql);
        if (pa !== pb) return pa - pb;
        return a.label.length - b.label.length;
      })
      .slice(0, SEARCH_MAX);
    searchActive = searchMatches.length ? 0 : -1;
    renderSearch(q);
    searchWrap.classList.add('open');
  }

  function renderSearch(q){
    if (!searchMatches.length){
      searchResults.innerHTML = '<div class="sr-empty">' +
        (searchMode === 'content' ? 'No matching descriptions' : 'No matching concepts') + '</div>';
      return;
    }
    searchResults.innerHTML = searchMatches.map((n, i) =>
      `<div class="sr-item${i === searchActive ? ' active' : ''}" role="option" data-id="${n.id}">` +
        `<span class="sr-dot" style="background:${hexOf(n.key)}"></span>` +
        `<span class="sr-text">` +
          `<span class="sr-label">${searchMode === 'content' ? htmlEscape(n.label) : highlight(n.label, q)}</span>` +
          (searchMode === 'content' ? `<span class="sr-snip">${snippet(n, q)}</span>`
            : (n.branch ? `<span class="sr-branch">${htmlEscape(n.branch)}</span>` : '')) +
        `</span>` +
      `</div>`).join('');
  }

  function closeSearch(){
    searchWrap.classList.remove('open');
    searchResults.innerHTML = '';
    searchMatches = []; searchActive = -1;
  }

  // Reveal + select + deep-link the chosen node, then dismiss the results (keep the query).
  function chooseSearch(id){
    if (id == null) return;
    revealAndSelect(id);
    pushHash(id);
    closeSearch();
    searchInput.blur();
  }

  function setActive(i){
    if (!searchMatches.length) return;
    searchActive = (i + searchMatches.length) % searchMatches.length;
    [...searchResults.children].forEach((el, idx) => el.classList.toggle('active', idx === searchActive));
    const el = searchResults.children[searchActive];
    if (el) el.scrollIntoView({block: 'nearest'});
  }

  const searchModeBtn = document.getElementById('search-mode');
  searchModeBtn.addEventListener('click', () => {
    searchMode = searchMode === 'concepts' ? 'content' : 'concepts';
    searchModeBtn.textContent = searchMode === 'concepts' ? 'Concepts' : 'Content';
    searchInput.placeholder = searchMode === 'concepts' ? 'Search concepts…' : 'Search descriptions…';
    runSearch(searchInput.value);
    searchInput.focus();
  });
  searchInput.addEventListener('input', () => runSearch(searchInput.value));
  searchInput.addEventListener('focus', () => { if (searchInput.value.trim()) runSearch(searchInput.value); });
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown'){ e.preventDefault(); setActive(searchActive + 1); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); setActive(searchActive - 1); }
    else if (e.key === 'Enter'){ e.preventDefault(); if (searchMatches[searchActive]) chooseSearch(searchMatches[searchActive].id); }
    else if (e.key === 'Escape'){ e.preventDefault(); if (searchWrap.classList.contains('open')) closeSearch(); else { searchInput.value = ''; searchWrap.classList.remove('has-text'); searchInput.blur(); } }
  });
  searchResults.addEventListener('click', (e) => {
    const item = e.target.closest('.sr-item');
    if (item) chooseSearch(item.dataset.id);
  });
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchWrap.classList.remove('has-text');
    closeSearch();
    searchInput.focus();
  });
  // Click outside the search box dismisses the dropdown.
  document.addEventListener('click', (e) => { if (!searchWrap.contains(e.target)) closeSearch(); });
  // Global "/" focuses search (unless already typing in an input).
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== searchInput && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
      e.preventDefault(); searchInput.focus();
    }
  });

  // On load: reveal a #slug deep link, or otherwise frame the tree. Uses setTimeout (not
  // requestAnimationFrame, which is paused in background tabs) and retries briefly until the
  // map has rendered. The initial fit is needed because markmap.create doesn't center the
  // tree into the (panel-narrowed) map area on its own — the root ends up clipped off-left.
  (function initView(tries){
    if (mm && mm.state && mm.state.data){
      if (location.hash) gotoHash(); else mm.fit();
      return;
    }
    if (tries > 0) setTimeout(() => initView(tries - 1), 50);
  })(40);
</script>
</body>
</html>

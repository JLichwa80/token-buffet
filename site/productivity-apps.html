e running router instances hold a startup snapshot of configuration state to prevent mid-session drift.", "252": "Custom Mode vs. Usage Mode | Dimension | Custom Mode (\"custom\") | Usage Mode (\"usage\") | | --- | --- | --- | | Primary Selection Rule | Follows strict custom_order sequence | Sorts backends by highest remaining quota % (remaining_pct) | | User Label in UI | \"Always use my best account first\" / \"Use best first\" | \"Spread work across accounts (save quota)\" | | Best Used For | Quality-focused workflows where one AI provider is strongly preferred | Quota preservation across multiple accounts to prevent rate limits | | Fallback Trigger | Moves to next in list only if higher-ranked backend is down, depleted, or errors | Moves to next highest-quota backend if top-headroom backend is unavailable |", "253": "In the architecture of the Token Buffet AI Subscription Hub, Tool Handoff represents a crucial protocol bridge that allows downstream software applications to leverage complex function calling, agentic tools, and local Model Context Protocol (MCP) servers while running on flat-rate command-line interface (CLI) subscriptions. When a client application (such as a developer assistant, Obsidian vault plugin, or local second-brain daemon) submits a prompt containing tool or function definitions, the Smart Router Gateway (port 8090) intercepts the request. Rather than allowing the backend vendor CLI to execute tools in its own remote environment or isolated CLI process, the router requests one structured tool-call decision from the backend model and delivers that decision back to the local client application for execution. Below is an in-depth breakdown of tool handoff mechanics, provider wire formats, and its role within the larger framework of Smart Routing & Tiers.", "254": "The fundamental objective of Tool Handoff is to separate reasoning and decision-making (handled by the subscription-backed AI model) from action execution (handled safely by the local client application).", "255": "When an incoming API payload carries tool or function schemas, the gateway passes those definitions to the selected backend vendor CLI. The vendor CLI generates a structured tool-call payload (specifying which function to invoke and supplying the necessary parameters) without running the tool itself.", "256": "To prevent the vendor CLI from attempting to execute functions inside its own process, provider configurations (registered_providers/<provider>/config.json) specify execution.tool_handoff_args. For example, both Claude Code and Grok Build configurations append --tools \"\" (an empty string argument) when invoking the CLI, signaling to the vendor engine that it should return a tool-choice decision while leaving tool execution strictly to the client.", "257": "Because different AI vendors use distinct communication protocols, Token Buffet's router translates and buffers tool decisions across four major wire formats:", "258": "Operating over the OpenAI Responses API, Codex CLI supports buffered function, custom freeform, and apply_patch tool handoff. The gateway holds continuation history for recent responses so multi-step tool calls can continue seamlessly.", "259": "Utilizing the standard OpenAI Chat Completions wire format, Grok Build supports buffered function-call handoff. During backend processing, it emits periodic empty chunks to keep client connections alive while the model formats its tool decision. Gemini Antigravity (/v1beta/models/{model}:generateContent): Operating via Gemini's GenerateContent protocol, Antigravity provides buffered function-call handoff for client-declared tools.", "260": "Communicating over the Anthropic Messages wire format (/v1/messages), Claude Code accepts tool declarations directly and returns structured tool_use content blocks to the client application.", "261": "Tool Handoff operates seamlessly alongside Token Buffet’s Smart Routing and Semantic Tier resolution pipeline: ```text [ Downstream Client App ] ──(Carries Tool Schemas)──▶ Smart Router (:8090) │ ┌────────────────────────┴────────────────────────┐ ▼                                                 ▼ Stage 1: Semantic Tier                           Stage 2: Load Balancing ('fast', 'medium', 'reasoning')                  ('usage' or 'custom' mode) │                                                 │ └────────────────────────┬────────────────────────┘ │ ▼ Selected Backend CLI Proxy (Invoked with --tools \"\" flag) │ ▼ [ Structured Tool-Call Decision ] │ ▼ [ Downstream Client App ] ◄──(Executes Tool Locally)── Returned to Client ```", "262": "Downstream tools invoke generic performance tiers (fast, medium, or reasoning) rather than fixed vendor model IDs. A complex agentic task requiring multi-tool reasoning can hit the reasoning tier (mapping to models like Claude Opus, GPT-6, or Gemini Pro High).", "263": "The router selects an active backend based on Usage Mode (routing to the provider with the highest remaining quota percentage) or Custom Mode (following a strict preference list).", "264": "Regardless of which provider handles the request, the router formats the client's tool definitions into the backend's expected CLI flags, receives the structured tool invocation payload, and packages it back into the wire format requested by the client.", "265": "Tool Handoff allows advanced local AI tools to maintain local state and privacy while tapping into subscription compute:", "266": "Claudia combines a Python memory daemon (~33 MCP tools over SQLite and vector embeddings) with an Obsidian 3D graph visualizer. By pointing ANTHROPIC_BASE_URL to port 8090, Claudia sends tool-heavy requests through the router. The router passes tool calls to the backend subscription model and returns the structured decision back to Claudia to query local SQLite databases or update Obsidian notes locally.", "267": "Isolated workspaces for Claude Code, Codex CLI, Grok Build, and Gemini Antigravity can request file modifications (apply_patch), shell executions (Bash), or code edits (Edit). The router ensures that tool decisions return to the initiating workspace launcher so actions are executed within the local project directory.", "268": "Downstream apps are configured by the same file set at three layers: the base `integrations/`, an app type such as `integrations/obsidian/`, and a registered instance under `registered_apps/<type>/<name>/`. Adding an app is a filesystem change, not an engine change.", "270": "The karpathywiki plugin (LLM Wiki) points at the router, with per-task tiers such as `ingestModel: \"fast\"`, `lintModel: \"reasoning\"`, and `queryModel: \"reasoning\"`.", "271": "A Claude Code based second brain that connects by setting `ANTHROPIC_BASE_URL` to the router in `.claude/settings.local.json`.", "272": "Claude Code, Codex CLI, Grok Build, and Gemini Antigravity presets under `integrations/chatbot/presets/`.", "273": "A further app type with its own installer.", "274": "`tbuffet add-app <type> [name] --path <dir>` (or the dashboard wizard, which calls `/api/apps/register`) runs `integrations/register.py`. It copies the type's files into the instance folder, overlays the chosen preset, substitutes placeholders, then runs the instance's `init.py` and `configure.py` to write the app's own settings file.", "275": "`tbuffet reconfigure-app <type> <name>` or the dashboard Re-apply action re-runs `configure.py`, pushing the router endpoint and tiers into the app while leaving its other settings alone.", "276": "Obsidian vaults choose a preset from `vault_types.json`: `default`, `finance-conference`, `research-papers`, or `daily-notes`. Each preset supplies entity and concept tags and system prompt instructions.", "277": "An app type's `init.py` can define `check()` (hides uninstalled types), `link()`, and `launch()`. `tbuffet open <type> <name>` and the dashboard Open button use the instance's own `launch()`.", "278": "In the ecosystem of the Token Buffet AI Subscription Hub, Obsidian running the karpathywiki plugin serves as the flagship knowledge management integration. Inspired by Andrej Karpathy's \"LLM Wiki\" paradigm, this setup converts flat-rate command-line interface (CLI) subscriptions—such as Claude Code, Codex CLI, Grok Build, and Gemini Antigravity—into a local knowledge-synthesis engine for personal vaults. By pointing the plugin's API base URL to Token Buffet's central router gateway on port 8090, users can run automated note ingestion, structured tag extraction, and vault-wide Q&A without paying per-token API fees or purchasing separate developer keys. Below is an in-depth breakdown of what the sources specify regarding Obsidian's notes Q&A engine, per-task smart routing, template customization, instance architecture, and position within the broader landscape of integrated applications.", "279": "The karpathywiki plugin transforms an Obsidian vault into an interconnected, synthesis-driven wiki:", "280": "Raw text, transcripts, or web captures dropped into a vault's inbox folder (_Inbox/) are automatically processed by background tasks. The engine extracts core entities and concepts, links related topic pages using [[wikilinks]], and deduplicates overlapping content.", "281": "Users can query their vault on any subject. Rather than returning simple keyword search matches, the Q&A engine queries the local router, synthesizes insights across multiple vault documents, cross-links relevant topic pages, and delivers a grounded answer.", "282": "The integration targets the community plugin settings file located at .obsidian/plugins/karpathywiki/data.json within the user's vault directory.", "283": "Obsidian leverages Token Buffet's per-task smart levels (\"usePerTaskModels\": true) defined inside app_settings.json. Instead of routing all vault actions to a single static AI model, different background tasks trigger distinct semantic model tiers based on computational complexity:", "284": "\"fast\"): High-frequency, low-latency background tasks—such as parsing incoming note text and generating initial entity tags—are assigned to the fast tier (Quick).", "285": "\"reasoning\"): Periodic vault maintenance, tag vocabulary enforcement, and link restructuring are assigned to the reasoning tier (Best).", "286": "\"reasoning\"): Complex multi-document analysis, comparative synthesis, and vault Q&A queries trigger the reasoning tier (Best). When a query or ingestion task is submitted, Token Buffet's Smart Router Gateway (port 8090) receives the requested tier and dynamically routes the prompt to whichever connected provider subscription currently holds the highest remaining quota headroom (in Usage Mode) or follows a hardcoded preference list (in Custom Mode).", "287": "To tailor extraction and Q&A behavior to specific types of knowledge bases, Obsidian integrations utilize reusable preset templates defined in vault_types.json: finance-conference: Tailored for financial transcripts and investor materials. Sets custom entity tags (person, organization, fund, asset_class, instrument, index) and custom concept tags (financial_strategy, portfolio_archetype, action_playbook), while supplying specialized system prompt instructions for financial analysis. research-papers: Optimized for academic literature, citations, methodology synthesis, and paper analysis. daily-notes: Designed for daily activity logs, personal journal entries, action item tracking, and task summaries. During registration or reconfiguration, choosing a preset overlays these custom tag schemas and system instructions into the plugin's configuration without requiring manual prompt engineering.", "288": "Obsidian vaults are registered and managed through standard CLI utilities or the Control Center Dashboard (port 8080):", "289": "Workspaces are registered using tbuffet add-app obsidian <NAME> --path <VAULT_PATH> --vault-type <PRESET> or through the 3-step modal wizard on the Dashboard (My Apps tab).", "290": "Each registered vault creates an instance folder under registered_apps/obsidian/<name>/ containing three configuration files: app_meta.json: Records the concrete location path of the vault's data.json file and the active vault_type preset. app_settings.json: Stores client endpoints (http://127.0.0.1:8090/v1/), active tiers, per-task smart levels, and token limits. vault_types.json: Maintains the schema preset definitions.", "291": "Executing tbuffet reconfigure-app obsidian <NAME> or clicking Re-apply in the Dashboard re-runs configure.py. This re-pushes updated endpoints and preset tags into .obsidian/plugins/karpathywiki/data.json while preserving all other user plugin settings intact.", "292": "In the broader landscape of Token Buffet's client software integrations, Obsidian plays a pivotal role: ```text ┌──────────────────────────────────────────┐ │    Token Buffet Integrated Apps Engine   │ └────────────────────┬─────────────────────┘ │ ┌─────────────────────────────────┴─────────────────────────────────┐ ▼                                                                   ▼ [ Flagship Knowledge Apps ]                                         [ Secondary Routable Apps ] • Obsidian (karpathywiki / LLM Wiki)                                • Brave Browser (Leo) • Claudia (Second Brain + 3D /brain graph)                          • Home Assistant / Raycast • AnythingLLM / Joplin / Logseq • Open WebUI / Jan / Msty ```", "293": "Obsidian is the fully completed flagship integration (#1 on the consumer routing roadmap) and serves as the baseline model for non-technical application delivery.", "294": "While Obsidian runs as a standalone note-taking app with karpathywiki via OpenAI endpoints, it also serves as the local knowledge projection for Claudia. Claudia combines a Claude Code persona, a Python memory daemon (~33 tools), and a 3D brain-graph visualizer (/brain) that projects synthesized topic pages into an Obsidian vault (~/.claudia/vault/) while routing prompts through port 8090", "295": "Obsidian exemplifies \"Delivery Tier A\" (configuring an existing routable app by pointing its endpoint field to port 8090). It proves the core architectural promise: multiple independent knowledge bases running seamlessly on a single, shared subscription backend.", "296": "In the larger context of the Token Buffet AI Subscription Hub, Claudia represents an advanced, specialized integration that showcases how complex, local \"second brain\" systems can offload AI computation across flat-rate subscriptions while keeping user memory and knowledge repositories strictly local. Below is an in-depth analysis of Claudia's architecture, its integration mechanics within Token Buffet, its semantic tier mapping, and its broader role in the integrated app ecosystem.", "297": "Claudia is a local, persona-driven \"second brain\" assistant built on top of Claude Code:", "298": "Combines an AI chief-of-staff persona with approximately 45 specialized skills to help users track commitments, manage relationships, analyze patterns, and think strategically.", "299": "Utilizes a Model Context Protocol (MCP) server equipped with roughly 33 tools operating over a local SQLite database and vector embeddings to retain long-term contextual memory.", "300": "Projects its synthesized memory into a structured Obsidian knowledge vault located at ~/.claudia/vault/, organized using the PARA layout with interconnected [[wikilinks]] and topic pages. 3D Brain-Graph Visualizer: Incorporates the /brain 3D brain-graph visualizer (\"graphify\") to interactively render and explore the conceptual connections across the local knowledge graph.", "302": "Stock upstream Claudia is locked exclusively to Claude Code and possesses no native model routing or multi-provider support.", "303": "Token Buffet adds a routing layer by setting ANTHROPIC_BASE_URL to http://127.0.0.1:8090 inside the workspace's .claude/settings.local.json file.", "304": "Because Token Buffet's Local Router Gateway natively understands and handles the Anthropic Messages wire format on /v1/messages, Claudia connects directly to port 8090 without requiring intermediate translation layers like LiteLLM. Claudia (Claude Code)⟶Token Buffet Router (:8090)⟶CLI Proxy⟶Vendor CLI", "305": "When Claudia issues requests for different Claude models, Token Buffet automatically maps those requests directly to its abstract semantic performance tiers: opus ⟶ reasoning (Best): Reserved for deep multi-document reasoning, complex strategic synthesis, and memory consolidation. sonnet ⟶ medium (Balanced): The default tier for standard conversation, drafting, and skill execution. haiku ⟶ fast (Quick): Utilized for high-frequency, low-latency background memory lookups and quick tag extraction. Once mapped to a tier, Token Buffet's Smart Router dispatches the request to whichever connected vendor subscription (Claude, Codex, Gemini Antigravity, or Grok) currently holds the highest remaining usage quota headroom (in Usage Mode) or follows the user's custom preference sequence (in Custom Mode).", "306": "Claudia instances are managed through Token Buffet's standardized integrations/claudia/ application framework:", "307": "A new Claudia instance is registered via the command line or dashboard using: tbuffet add-app claudia \"My Claudia\" --path \"/path/to/claudia\"", "308": "Registration creates an isolated instance directory under registered_apps/claudia/ containing: app_config.json: Defines the workspace root path and initial client settings. app_settings.json: Configures ANTHROPIC_BASE_URL as http://127.0.0.1:8090 in .claude/settings.local.json. init.py: Writes and merges the local gateway redirect into the target workspace's .claude/settings.local.json.", "309": "The launcher hook enables the Open action button in the Control Center Dashboard (http://127.0.0.1:8080). Clicking Open launches a visible terminal window (PowerShell on Windows or Apple Terminal via AppleScript on macOS) with environment overrides pre-applied.", "310": "Token Buffet includes a pre-registered demo instance located at registered_apps/claudia/My-Client-Relationships-Management-Demo/.", "311": "Within the broader landscape of integrated applications, Claudia occupies a unique position alongside Obsidian:", "312": "Both Claudia's vault and the Obsidian LLM Wiki plugin adhere to Karpathy-style knowledge synthesis patterns. Together, they showcase the \"second brain + wiki\" story: Claudia provides an active assistant with a 3D brain graph, while Token Buffet powers the underlying AI engine end-to-end.", "313": "Local SQLite databases, vector embeddings, and Obsidian vault notes remain entirely private on the user's machine, while the heavy LLM text generation is offloaded across subscription CLIs.", "315": "Whether non-Claude backends like Gemini Antigravity (agy) fully support Claudia's MCP tool stream protocol remains an unverified open item.", "316": "Direct PDF and image ingestion inside Claudia sessions is currently blocked until multimodal proxy forwarding is implemented.", "317": "In the architecture of the Token Buffet AI Subscription Hub, Workspace Presets and Configurable App Integrations provide the template-driven foundation that connects client software—such as Obsidian knowledge vaults, Claudia second-brain workspaces, and developer chatbot CLIs—to the central API gateway (port 8090). Rather than hardcoding vendor or application logic into the router or dashboard, Token Buffet adopts a config-driven, filesystem-first ethos. Integration types are defined as template directories under integrations/<app>/ (or integrations/chatbot/presets/), and registered instances are maintained in registered_apps/<type>/<name>/. This design allows users to register, configure, and reconfigure multiple independent workspaces while tailoring their extraction behavior, prompt schemas, and model routing to specific tasks.", "318": "When an application or workspace is registered, the system creates an isolated instance directory containing three core JSON configuration files that drive its behavior: app_meta.json / app_config.json: Records the concrete location path of the client application (e.g., vault folder or workspace root). Tracks the bridge configuration target file (e.g., .obsidian/plugins/karpathywiki/data.json for Obsidian or .claude/settings.local.json for Claudia). Stores active preset template metadata (such as the selected vault_type). app_settings.json: Maintains active client-side settings pushed into the target application, including the gateway endpoint (http://127.0.0.1:8090/v1/), active semantic model tiers (fast, medium, reasoning), and token limits.", "319": "true), allowing different background actions within the app to trigger different model tiers (e.g., using fast for document ingestion while assigning reasoning to complex Q&A and periodic linting). vault_types.json: Stores schema definitions, custom entity/concept tag vocabularies, and specialized system prompt instructions for that instance.", "320": "The lifecycle of a workspace preset is managed through a standardized two-stage execution pipeline: ```text [ User / Dashboard / CLI ] │ ▼ ```", "321": "Registration (integrations/register.py) ```text ├── Copies integrations/<type>/ template files ➔ registered_apps/<type>/<name>/ ├── Overlays selected preset (vault_types or chatbot preset) ├── Substitutes placeholders ([app_path], [vault_type]) in app_meta.json └── Runs init.py (scaffolds folders) & configure.py (pushes settings to client app) │ ▼ ```", "322": "Reconfiguration (tbuffet reconfigure-app / Dashboard 'Re-apply') ```text └── Re-executes instance's configure.py ➔ updates client app config without overwriting non-bridge settings ``` Registration (tbuffet add-app or integrations/register.py): Invoked via the command line or the Dashboard wizard. Copies base files from integrations/<app>/ into registered_apps/<type>/<name>/. Overlays files from the selected preset directory (if presets_directory is declared). Substitutes path placeholders (like [app_path] and [vault_type]) in app_meta.json. Executes init.py to scaffold required workspace folders (e.g., _Inbox/ or local .claude/ directories) and runs configure.py to write settings directly into the target client app's native configuration file.", "323": "Allows operators or users to edit app_settings.json or vault_types.json and re-run configure.py. Pushes updated endpoints, model tiers, or custom extraction tags directly into the target application's settings file while preserving other non-Token-Buffet user preferences intact.", "324": "The sources detail several specialized preset types across different application domains:", "325": "Obsidian integrations utilize preset schemas stored in vault_types.json to customize how incoming notes and transcripts are parsed and synthesized: default: Baseline entity and concept extraction schema. finance-conference: Tailored for financial transcripts and investor presentations. Sets custom entity tags (person, organization, fund, asset_class, instrument, index), custom concept tags (financial_strategy, portfolio_archetype, action_playbook), and provides specialized system prompt instructions for financial analysis. research-papers: Optimized for academic literature, citations, methodology comparison, and paper synthesis. daily-notes: Designed for personal journals, daily logs, task tracking, and periodic summaries.", "326": "Developer chatbot CLIs function as client workspaces using built-in presets (claude, codex, grok, and agy): Each preset targets specific configuration files—such as .claude/settings.local.json for Claude Code, .codex/config.toml for Codex CLI, .grok/config.toml for Grok Build, and .gemini/antigravity-cli/settings.json for Gemini Antigravity. Launchers set custom session configuration homes (e.g., CODEX_HOME, GROK_HOME, or GOOGLE_GEMINI_BASE_URL) to isolate project workspaces and prevent native CLI database locks or global configuration overwrites.", "327": "Configures Claudia's Claude Code session by setting ANTHROPIC_BASE_URL to http://127.0.0.1:8090 inside .claude/settings.local.json. Allows Claudia's persona, Python memory daemon (MCP server with ~33 tools over SQLite/vector embeddings), and 3D /brain graph visualizer to route prompts across all connected subscriptions.", "328": "Workspace presets are designed for easy setup by both technical operators and everyday non-technical users:", "330": "Token Buffet registers vendor CLI agents as router clients, so each one can run in its own workspace while using the pooled subscriptions. Every client points at the router root, `http://127.0.0.1:8090`, like it would at an Ollama server.", "331": "| Client | Configuration | Router Endpoint | Notes | | --- | --- | --- | --- | | Claude Code | `.claude/settings.local.json` (passed with `--settings`) | `/v1/messages` (Anthropic Messages) | Sets `CLAUDE_CODE_DISABLE_THINKING=1` and enables gateway model discovery | | Codex CLI | `.codex/config.toml` (`CODEX_HOME` set to the workspace) | `/v1/responses` (OpenAI Responses) | Needs the `openai` SDK in the proxy environment | | Grok Build | `.grok/config.toml` (`GROK_HOME` set to the workspace) | `/v1/chat/completions` (OpenAI Chat) | Emits periodic empty chunks to keep the connection open | | Gemini Antigravity (agy) | `.gemini/antigravity-cli/settings.json` (`GOOGLE_GEMINI_BASE_URL`) | `/v1beta/models/{model}:generateContent` (Gemini) | Backend proxy uses a separate sign-in home at `data/provider_homes/agy` |", "332": "Register a client with `tbuffet add-chatbot <cli> --path <folder>`, or from the dashboard's My Chatbots tab, then open it with `tbuffet open chatbot <name>`. Launchers scope settings and home overrides to the chosen workspace, so global CLI setups are untouched.", "333": "When a client workspace sends a prompt to the router, the router excludes that client's own backend proxy from the candidates to avoid a loopback.", "334": "Each client receives one structured tool-call decision per request and executes the tool locally. Responses API continuation history (`previous_response_id`) is held in router memory for about 100 recent responses and is lost on restart.", "335": "Within the Token Buffet AI Subscription Hub, developer command-line interfaces (CLIs) function both as backend provider engines and as downstream client tools. Among the supported developer tools, Claude Code occupies a key position due to its integration using the Anthropic Messages endpoint (/v1/messages). By leveraging project-specific configuration files and session environment overrides, Token Buffet enables Claude Code sessions to route prompts directly through its local gateway (http://127.0.0.1:8090) without altering the user's global system configuration or incurring per-token developer API fees.", "336": "Token Buffet interfaces with Claude Code by acting as a local Anthropic-compatible API gateway:", "337": "Claude Code communicates over the Anthropic Messages API (/v1/messages), issuing requests formatted as POST /v1/messages?beta=true. During session initialization or health checks, it may also probe HEAD /api/hello.", "338": "Rather than editing global settings (~/.claude), Token Buffet creates a project-local configuration at .claude/settings.local.json. Workspace launchers explicitly pass this configuration using the --settings parameter.", "340": "The workspace launcher injects CLAUDE_CODE_DISABLE_THINKING=1 to disable native thinking modes.", "341": "It enables gateway model discovery so executing the /model command inside the Claude Code CLI cleanly populates and lists Token Buffet's available semantic model tiers.", "342": "When Claude Code issues prompts containing client-side tool declarations, Token Buffet configures the backend using execution.tool_handoff_args set to --tools \"\". This signals the vendor engine to return a structured tool-call decision while leaving actual tool execution safely to the client workspace.", "343": "Token Buffet provisions isolated workspace launchers for four distinct developer chatbot CLIs: | Client | Configuration File & Workspace Mechanism | Bridge API Endpoint | Protocol & Execution Characteristics | | --- | --- | --- | --- | | Claude Code | .claude/settings.local.json (passed explicitly with --settings). | /v1/messages (Anthropic Messages). | Disables internal thinking (CLAUDE_CODE_DISABLE_THINKING=1), enables gateway model discovery for /model, and uses --tools \"\" for tool handoff. | | Codex CLI | .codex/config.toml (session CODEX_HOME set to workspace). | /v1/responses (OpenAI Responses). | Requires the openai Python SDK in the proxy environment; supports buffered function, custom freeform, and apply_patch tool handoff holding history up to 100 responses. | | Grok Build | .grok/config.toml (session GROK_HOME set to workspace). | /v1/chat/completions (OpenAI Chat). | Emits periodic empty chunks during backend processing to keep connection sockets active during long generations. | | Gemini Antigravity (agy) | .gemini/antigravity-cli/settings.json (session GOOGLE_GEMINI_BASE_URL). | /v1beta/models/{model}:generateContent (Gemini API). | Uses an independent backend sign-in home at data/provider_homes/agy so backend proxies and client demos stay isolated. | To prevent infinite loopback calls when a chatbot client workspace issues a prompt, the Smart Router enforces an originating CLI exclusion rule, automatically bypassing that chatbot's own backend proxy during model dispatch.", "344": "The Anthropic Messages endpoint on port 8090 plays an essential role in Token Buffet's integration with Claudia, an advanced local \"second brain\" assistant:", "345": "Claudia is a local assistant built on top of Claude Code, combining a persona, ~45 skills, a Python memory daemon (MCP server with ~33 tools over SQLite and vector embeddings), and an Obsidian vault projection visualized through a /brain 3D brain-graph.", "346": "While stock upstream Claudia is locked exclusively to Claude Code without model management, Token Buffet remaps ANTHROPIC_BASE_URL inside Claudia's .claude/settings.local.json to http://127.0.0.1:8090.", "347": "Because Token Buffet's router natively handles the Anthropic Messages wire format on /v1/messages, Claudia connects directly to the router without needing intermediate translation tools like LiteLLM.", "348": "Claudia's requested Claude models are translated directly into Token Buffet's semantic performance tiers:", "352": "Adding and operating Claude Code workspaces is managed seamlessly through command-line utilities or the Control Center Dashboard:", "353": "Workspaces are registered using commands such as tbuffet add-app claudia \"My Claudia\" --path \"/path/to/claudia\" or tbuffet add-chatbot claude --path /path/to/workspace.", "354": "From the Dashboard at http://127.0.0.1:8080, the My Chatbots tab provides dedicated connection controls (such as the \"Connect Claude-Code instance\" button). The interface prompts the user for a workspace folder path and a display label, validating that no folder is registered twice for the same CLI.", "355": "Clicking Open launches a visible terminal window (using PowerShell on Windows or AppleScript via Apple Terminal on macOS) with the appropriate workspace session overrides applied.", "356": "Within the Token Buffet AI Subscription Hub, Codex CLI functions as both a backend subscription provider engine and a client workspace. When operating as a client, Codex routes prompts through Token Buffet's central router (http://127.0.0.1:8090), allowing developers to utilize paid OpenAI/ChatGPT subscriptions without paying per-token API fees or altering their global CLI setup. Below is a detailed breakdown of how Codex CLI integrates with Token Buffet through the OpenAI Responses API and where it fits within the broader ecosystem of chatbot and CLI clients.", "357": "Unlike traditional Chat Completions endpoints, Codex CLI interacts with Token Buffet using OpenAI's Responses API endpoint:", "358": "Communicates over POST /v1/responses.", "359": "Requires the openai Python SDK to be installed in the proxy environment. If the SDK is missing, the backend proxy cleanly returns an HTTP 503 error to the client.", "360": "To support long, multi-step conversational interactions, the local router holds continuation history for up to 100 recent responses in memory. (Note: Because this state is stored in memory, continuation history is reset if the router process restarts ).", "361": "Standard vendor CLIs often enforce global user configurations (such as ~/.codex), which can lead to configuration conflicts or database lockups during concurrent runs. Token Buffet overcomes this through session-level environment overrides:", "362": "Settings are stored locally within the project workspace inside .codex/config.toml.", "363": "When launching a Codex CLI session, the workspace launcher dynamically sets the environment variable CODEX_HOME to point directly to that workspace's .codex folder.", "364": "Because the router endpoint is loaded strictly within the workspace's session environment, global user settings remain entirely untouched.", "365": "Clicking Open on a registered Codex instance in the Dashboard launches a visible terminal window (using PowerShell on Windows or AppleScript via Apple Terminal on macOS) with workspace environment overrides applied.", "366": "Codex CLI supports advanced function calling and file editing through Token Buffet's structured tool handoff protocol:", "367": "Receives structured function-call decisions formatted by the model and delivers them back to the client workspace for execution.", "368": "Handles non-standard client tool declarations passed through the Responses API. apply_patch Support: Supports native file modification commands (such as applying code diffs across project files) directly within the developer workspace.", "369": "Token Buffet provisions isolated workspaces for four primary developer chatbot CLIs, each tailored to a specific vendor protocol: | Client | Configuration Mechanism | Bridge Endpoint | Key Protocol Features | | --- | --- | --- | --- | | Claude Code | .claude/settings.local.json (via --settings) | /v1/messages (Anthropic) | Disables internal thinking mode (CLAUDE_CODE_DISABLE_THINKING=1) and enables gateway model discovery for /model. | | Codex CLI | .codex/config.toml (CODEX_HOME override) | /v1/responses (OpenAI Responses) | Requires openai SDK; supports buffered function, custom freeform, and apply_patch handoffs with 100-response history. | | Grok Build | .grok/config.toml (GROK_HOME override) | /v1/chat/completions (OpenAI Chat) | Emits periodic empty chunks during backend work to keep client connection sockets active. | | Gemini Antigravity | .gemini/antigravity-cli/settings.json (GOOGLE_GEMINI_BASE_URL) | /v1beta/models/{model}:generateContent (Gemini API) | Operates an independent sign-in home at data/provider_homes/agy to isolate backend proxies from client demos. | Key Ecosystem Rules for Chatbot Clients", "370": "When a Codex CLI workspace sends a prompt to port 8090, the Smart Router automatically excludes Codex's own backend proxy from candidate providers to prevent infinite loopback requests.", "371": "Workspaces are registered via the CLI (tbuffet add-chatbot codex --path <PATH>) or through the My Chatbots tab in the Control Center Dashboard (http://127.0.0.1:8080).", "372": "Within the Token Buffet AI Subscription Hub, Gemini Antigravity (referred to internally as the agy preset or provider) is one of the four primary command-line interface (CLI) tools integrated as both a backend subscription provider and a client application. By wrapping Google's native GenerateContent API endpoint (/v1beta/models/{model}:generateContent) and configuring session-level environment overrides, Token Buffet allows developers and local applications to route requests through Google's Gemini models via the central gateway (http://127.0.0.1:8090) without incurring per-token API fees or altering system-wide CLI installations. Below is an in-depth analysis of what the sources cover regarding Gemini Antigravity's protocol implementation, workspace isolation mechanics, tool handoff capabilities, and role within the broader chatbot client ecosystem.", "373": "Unlike OpenAI-compatible endpoints (/v1/chat/completions) or Anthropic Messages endpoints (/v1/messages), Gemini Antigravity communicates using Google's native Gemini API structure:", "374": "Requests are sent over the Gemini GenerateContent wire format at POST /v1beta/models/{model}:generateContent.", "375": "Antigravity natively supports specifying a custom API base URL via the GOOGLE_GEMINI_BASE_URL environment variable.", "376": "When a Gemini Antigravity chatbot workspace is launched, its workspace launcher sets GOOGLE_GEMINI_BASE_URL to point strictly to Token Buffet's router on port 8090 (http://127.0.0.1:8090) for that specific session.", "377": "Standard vendor CLIs often enforce global user configuration directories (such as ~/.gemini), which can cause database lockups or profile corruption during concurrent execution. Token Buffet circumvents these conflicts through multi-layered session environment isolation:", "378": "Client configuration for Antigravity workspaces is maintained locally in .gemini/antigravity-cli/settings.json inside the project folder.", "379": "The workspace launcher sets the session home path directly to the workspace folder, ensuring that settings apply exclusively to that project session without altering global CLI defaults.", "380": "To prevent credential overlap or state pollution between client demo workspaces and backend proxy instances, the agy backend proxy uses a dedicated, isolated home directory at data/provider_homes/agy. This directory requires its own independent login authentication from the client workspace.", "381": "When a client application or developer workspace issues a prompt containing function declarations or client-side tools, Token Buffet processes the execution through structured tool handoff:", "382": "Antigravity supports buffered function-call responses formatted according to Gemini's schema requirements.", "383": "The Smart Router receives tool definitions from the client, requests one structured tool-choice decision from the backend Gemini model, and returns that decision payload to the client application.", "384": "The actual execution of the tool (e.g., running shell commands, modifying local files, or querying local databases) is handled safely by the downstream client workspace rather than inside the proxy process.", "385": "While Antigravity supports structured tool handoffs, the documentation notes that whether the agy backend fully supports Claude-style Model Context Protocol (MCP) tool streams (such as those used by the Claudia second-brain assistant) remains an unverified open item.", "386": "Token Buffet provisions isolated workspace launchers for four distinct developer chatbot CLIs, each tailored to its native API wire format: | Chatbot Client | Configuration Mechanism | Bridge API Endpoint | Key Protocol & Execution Characteristics | | --- | --- | --- | --- | | Gemini Antigravity (agy) | .gemini/antigravity-cli/settings.json (session home set to workspace; GOOGLE_GEMINI_BASE_URL) | /v1beta/models/{model}:generateContent | Uses independent backend home (data/provider_homes/agy); supports buffered function-call handoff. | | Claude Code | .claude/settings.local.json (explicitly passed via --settings) | /v1/messages (Anthropic Messages) | Disables internal thinking (CLAUDE_CODE_DISABLE_THINKING=1) and enables gateway model discovery for /model. | | Codex CLI | .codex/config.toml (CODEX_HOME set to workspace) | /v1/responses (OpenAI Responses) | Requires openai Python SDK; supports function, freeform, and apply_patch tool handoffs with 100-response history. | | Grok Build | .grok/config.toml (GROK_HOME set to workspace) | /v1/chat/completions (OpenAI Chat) | Emits periodic empty chunks during backend processing to prevent connection socket timeouts. |", "387": "To prevent infinite loopback loops across the local network, the Smart Router enforces an originating CLI exclusion rule: When an Antigravity chatbot workspace submits a prompt to port 8090, the router automatically excludes agy's own backend proxy from the list of candidate providers. The prompt is routed to an alternate eligible provider (such as Claude, Codex, or Grok) based on the active routing mode (Usage Mode or Custom Mode) and semantic performance tier.", "388": "Gemini Antigravity is fully integrated into Token Buffet's tier resolution and fleet monitoring subsystems:", "389": "In config/router_config.json, the agy provider is mapped to specific model IDs across semantic performance tiers. For example, under the reasoning tier (Best), the router maps agy to gemini-3.1-pro-high.", "390": "Users register Antigravity chatbot workspaces via the command line using tbuffet add-chatbot agy --path <PATH> or through the My Chatbots tab on the Control Center Dashboard (http://127.0.0.1:8080).", "391": "On the Dashboard Home and Accounts panels, Gemini Antigravity displays live status indicators (🟢 connected) and period-based quota gauges (tracking gemini_5h and gemini_weekly usage limits and reset countdowns).", "392": "Clicking Open next to an Antigravity instance in the Dashboard launches a visible terminal window (using PowerShell on Windows or AppleScript via Apple Terminal on macOS) with GOOGLE_GEMINI_BASE_URL and session home environment overrides pre-applied.", "393": "Within the Token Buffet AI Subscription Hub, Grok Build functions as both a backend subscription provider engine and a client workspace for developers. When configured as a chatbot client, Grok Build routes its prompts through Token Buffet's central API gateway on port 8090 (http://127.0.0.1:8090), allowing developers to harness xAI's Grok models without paying per-token developer API fees or altering system-wide CLI settings. Below is a detailed breakdown of what the sources specify regarding Grok Build's reliance on the OpenAI Chat Completions wire format, its workspace configuration mechanics, its tool handoff protocol, and its position within the broader ecosystem of chatbot and CLI clients.", "394": "Grok Build communicates with the local router using the standard OpenAI Chat Completions API format:", "395": "Requests are sent over the POST /v1/chat/completions wire format.", "396": "To prevent HTTP connection sockets from timing out during long text generations or heavy reasoning tasks, Grok Build's proxy handler emits periodic empty chunks while the backend CLI processes the request. This keeps the socket active until the model delivers its completed output or streaming delta.", "397": "Supports structured tool-call responses formatted according to standard OpenAI function-calling specifications.", "398": "Standard vendor CLIs often enforce global user configuration paths (such as ~/.grok), which can cause database locks or settings conflicts when multiple sessions run concurrently. Token Buffet resolves this through session environment overrides:", "399": "Workspace settings are stored in .grok/config.toml within the client project folder.", "400": "When launching a Grok Build workspace, the launcher sets the session environment variable GROK_HOME to point directly to that workspace's .grok directory.", "401": "Because settings are scoped exclusively to that session's environment, the user's global system CLI installation remains completely untouched.", "402": "Launching a Grok workspace from the Control Center Dashboard opens a visible terminal window (using PowerShell on Windows or AppleScript via Apple Terminal on macOS) with GROK_HOME and router endpoint overrides applied.", "403": "When a developer in a Grok Build workspace submits a prompt containing client tool schemas or function declarations, Token Buffet manages execution via structured tool handoff:", "404": "The Smart Router forwards the tool definitions to the backend model to obtain a structured tool-call decision.", "405": "Provider definitions configure execution.tool_handoff_args with --tools \"\" (an empty string argument) when invoking the CLI. This signals the Grok backend engine to return a structured tool decision without attempting to run the tool inside the backend proxy process.", "406": "The router receives the structured tool payload from Grok and delivers it back to the client workspace, ensuring local file modifications, terminal commands, or code edits are executed safely by the local client application.", "407": "Token Buffet provisions isolated workspaces for four primary developer chatbot CLIs, each tailored to its native API wire format: | Chatbot Client | Configuration Mechanism | Bridge API Endpoint | Key Protocol & Execution Features | | --- | --- | --- | --- | | Grok Build | .grok/config.toml (GROK_HOME override) | /v1/chat/completions (OpenAI Chat) | Emits periodic empty chunks during long generations; uses --tools \"\" for buffered function handoffs. | | Claude Code | .claude/settings.local.json (passed via --settings) | /v1/messages (Anthropic Messages) | Disables internal thinking (CLAUDE_CODE_DISABLE_THINKING=1) and enables gateway model discovery for /model. | | Codex CLI | .codex/config.toml (CODEX_HOME override) | /v1/responses (OpenAI Responses) | Requires openai Python SDK; supports function, freeform, and apply_patch handoffs holding 100-response history. | | Gemini Antigravity (agy) | .gemini/antigravity-cli/settings.json (GOOGLE_GEMINI_BASE_URL) | /v1beta/models/{model}:generateContent (Gemini API) | Operates an independent backend home (data/provider_homes/agy) to isolate backend proxies from client demos. |", "408": "To ensure smooth operation across the local network, Token Buffet enforces two essential operational rules for Grok Build:", "409": "When a Grok Build chatbot workspace sends a prompt to port 8090, the Smart Router automatically excludes Grok's own backend proxy from the list of candidate providers to prevent infinite loopback requests.", "410": "Workspaces can be registered via the command line using tbuffet add-chatbot grok --path <PATH> or through the My Chatbots tab on the Control Center Dashboard (http://127.0.0.1:8080).", "411": "In the architecture of the **Token Buffet AI Subscription Hub**, **Potential Consumer Integrations** represent the strategic expansion layer designed to bring flat-rate, subscription-powered AI to regular, non-technical everyday users. While developer tools focus on terminal automation and coding, consumer integrations demonstrate how interactive command-line interface (CLI) subscriptions—such as **Claude Code**, **Codex CLI**, **Grok Build**, and **Gemini Antigravity (`agy`)**—can power everyday desktop applications, browser assistants, voice agents, and personal knowledge bases without requiring per-token developer API keys or incurring usage bills. An analysis of the local AI application landscape reveals how Token Buffet bridges subscription quotas into consumer software, the hard boundaries of routable versus cloud-locked tools, the top consumer routing targets, and the three-tier delivery framework designed for everyday users. ---", "412": "The local AI landscape has structurally shifted from generic, standalone conversational windows toward domain-embedded inference engines where LLMs operate behind native UI triggers, global hotkeys, and automated event pipelines. However, regular consumers who pay monthly fees for cloud AI subscriptions (such as Claude, ChatGPT, Gemini, or Grok) are typically unable to use those subscriptions inside third-party desktop tools because vendor web platforms do not expose developer API keys. Token Buffet solves this through its **Universal Configuration Rule**: ```text ┌─────────────────────────────────────────────────────────────┐ │    Everyday Consumer Software (Brave Leo, Raycast, etc.)    │ └──────────────────────────────┬──────────────────────────────┘ │ Universal Config: │ • Base URL: http://127.0.0.1:8090/v1 │ • Model Name: fast / medium / reasoning │ • API Key: dummy (e.g. 'ollama') ▼ ┌─────────────────────────────────────────────────────────────┐ │             Smart Router Gateway (Port 8090)                 │ │  • Emulates OpenAI (/v1) & Ollama (/api) REST Endpoints     │ │  • Translates Semantic Performance Tiers                     │ │  • Usage-Mode Load Balancing Across Subscriptions           │ └──────────────────────────────┬──────────────────────────────┘ │ Piped Subprocess Prompts ▼ ┌─────────────────────────────────────────────────────────────┐ │  Logged-in CLI Subscriptions (Claude, Codex, Grok, Agy)    │ └─────────────────────────────────────────────────────────────┘ ``` By serving both **Ollama** (`/api/chat`, `/api/generate`) and **OpenAI-compatible** (`/v1/chat/completions`) endpoints on **port 8090**, any application that supports custom base URLs or Ollama server configurations can connect with a two-line setup. Downstream software requests generic **semantic performance tiers**—**`fast`** (Quick), **`medium`** (Balanced), or **`reasoning`** (Best)—and Token Buffet's Smart Router dynamically dispatches each query to whichever logged-in subscription currently holds the highest available quota headroom. ---", "413": "To set user expectations accurately, Token Buffet establishes a strict distinction between cloud-locked platforms and routable consumer software:", "414": "Major mainstream web platforms—including ChatGPT web, Gemini web, Claude.ai web, Perplexity Pro, Canva Magic, CapCut, Grammarly, Notion AI, Otter.ai, and the Opera browser (which includes local LLMs but provides no custom API endpoint setting)—are vendor-locked and cannot be re-pointed to local bridges.", "415": "Token Buffet focuses exclusively on software built around a **\"Bring Your Own Model\" (BYOM)** or custom endpoint architecture, allowing users to power their favorite open-source or desktop software with flat-rate subscription quotas. ---", "416": "Token Buffet prioritizes consumer targets based on installation reach, value-to-effort ratios, and native API flexibility: | # | Application | Category / Built-in Feature | Connection Mechanism | Fit & Strategic Value | | :---: | :--- | :--- | :--- | :--- | | **1** | **Obsidian** | Knowledge Vault, Notes Q&A & Wikilinks | `karpathywiki` plugin → `http://127.0.0.1:8090` | ★★★ **Flagship Target (Completed)** | | **2** | **Brave Browser (Leo)** | BYOM Browser Assistant: Page Summaries & Web Chat | Custom OpenAI Base URL → `http://127.0.0.1:8090/v1/chat/completions` | ★★★ **Best Next Target** (\"One field, huge reach\") | | **3** | **Raycast** | System-Wide Desktop Shortcuts & Commands | AI → Custom Provider / Ollama host `:8090` | ★★★ Top desktop shortcut launcher | | **4** | **Home Assistant** | Smart Home Voice Control / Conversation Agent | Native Ollama Integration → `http://127.0.0.1:8090` | ★★★ \"Talk to your house\" (Most impressive voice demo) | | **5** | **Joplin** | Open-Source Note Chat & Summaries | Plugins (Jarvis, NoteLLM) → `:8090/v1` | ★★ Non-Obsidian markdown notebooks | | **6** | **Logseq** | Privacy-First Outliner Writing Assistant | Plugins (`logseq-copilot`) → `:8090/v1` | ★★ Block-level outliner summaries | | **7** | **Thunderbird** | Private Email Reply Drafting & Thread Summaries | Extension (\"Ollama Compose\") → `:8090` | ★★ Right-click private inbox triage | | **8** | **AnythingLLM** | Turnkey Private Document Chat & Workspaces | LLM Provider → Generic OpenAI `:8090/v1` | ★★ Isolated PDF & folder Q&A | | **9** | **Enchanted / Msty** | Native Desktop & Mobile Chat Clients | Ollama Host → `http://127.0.0.1:8090` | ★★ Friendly desktop frontends | | **10**| **Claudia** | Local \"Second Brain\" Chief-of-Staff Assistant | `.claude/settings.local.json` → `:8090` | ★★ 3D `/brain` graph visualizer & MCP daemon | ---", "417": "To ensure regular users never have to edit YAML configuration files or manage loopback ports, Token Buffet implements a three-tier delivery framework:", "418": "Re-pointing an existing, routable third-party app's endpoint field directly to port 8090 (e.g., Brave Leo, Raycast, Home Assistant, Joplin, Thunderbird, AnythingLLM, Open WebUI, or Jan).", "419": "Creating a lightweight local script or bot bridge where no native consumer app exposes an endpoint (e.g., a Telegram messaging bot bridge or a background IMAP draft script for email).", "420": "Explicitly documenting non-routable tools so users understand system boundaries.", "421": "Non-technical users manage these connections through the **Control Center Dashboard**. The dashboard's 3-step **Add-an-App Wizard** under the **My Apps** tab guides users through selecting an app type, choosing a workspace folder via a visual directory picker, and picking plain-language template presets (such as *\"Research papers\"* or *\"Daily notes\"*). Under the hood, the dashboard executes `integrations/register.py` and pushes updated configuration files directly into target client software. ---", "422": "Token Buffet focuses its consumer rollout around four high-value demonstration stories: 1.  **Unified Cross-Provider Chat (Open WebUI / Jan / Msty)**: Pointed at `http://127.0.0.1:8090/v1`, Open WebUI or desktop frontends provide a single ChatGPT-style interface with multi-user RAG, document uploads, and web search, while Token Buffet load-balances prompts across active subscriptions in the background. 2.  **Personal Knowledge & Journaling (Obsidian LLM Wiki / Plume)**: Combines Obsidian's `karpathywiki` engine with local markdown notebooks, turning daily notes and meeting transcripts into interconnected topic pages with `[[wikilinks]]`. 3.  **Private Email Triage (Thunderbird + Ollama Compose)**: Allows users to right-click incoming messages in Mozilla Thunderbird to generate contextual reply drafts, summarize 20-message email chains into 3-bullet decision digests, and assign color tags locally without exposing sensitive correspondence to commercial cloud trackers. 4.  **Smart Home Autonomy (Home Assistant)**: Leverages Home Assistant's native Ollama integration to evaluate natural-language questions about household states (*\"Did anyone leave the garage door open?\"*) and trigger complex home automations completely offline.", "423": "In the strategy outlined for the Token Buffet AI Subscription Hub, Raycast represents a high-priority integration target for bringing subscription-powered AI to desktop shortcuts and launcher commands. By connecting Raycast’s native local AI features to Token Buffet’s central router on port 8090, users can execute system-wide AI commands across macOS and Windows—drawing directly from active Claude Code, Codex CLI, Grok Build, and Gemini Antigravity subscriptions without paying per-token developer API fees.", "424": "Raycast is a keyboard-driven desktop launcher and productivity assistant for macOS and Windows. Its built-in AI capabilities allow users to trigger system-wide commands from anywhere in the operating system without opening a web browser:", "425": "Summarizing selected text, rewriting prose, explaining code snippets, or translating text via global desktop shortcuts.", "426": "Running user-defined prompt templates and scripts directly from the Raycast launcher overlay.", "427": "Generating quick answers and inline completions using clipboard contents or highlighted text across any active desktop application.", "428": "Connecting Raycast to Token Buffet leverages Raycast's built-in Local Models / Custom Provider support:", "429": "Inside Raycast settings (AI -> Local Models / Custom Provider), point the Ollama server/host URL to http://127.0.0.1:8090", "430": "Enter one of Token Buffet’s abstract semantic performance tiers—fast (Quick), medium (Balanced), or reasoning (Best). The router automatically populates dropdowns via /v1/models or /api/tags and dispatches requests to whichever connected provider currently holds the highest available quota headroom.", "431": "Enter any dummy placeholder string (e.g., ollama), as local request authentication is handled internally by the bridge.", "432": "Raycast occupies a prominent place in Token Buffet's consumer expansion strategy across four key dimensions: ```text ┌──────────────────────────────────────────────┐ │          Routable Consumer Apps             │ └──────────────────────┬───────────────────────┘ │ ┌────────────────────────────────┼────────────────────────────────┐ ▼                                ▼                                ▼ [ #1 Obsidian ]                  [ #2 Brave Leo ]                 [ #3 Raycast ] • Flagship Knowledge Vault       • Browser Assistant              • System-Wide Desktop • Notes Q&A & Wikilinks          • Page Summaries & Web Chat      • Shortcuts & Quick Commands • Delivery Tier A                • Delivery Tier A                • Delivery Tier A ```", "433": "On Token Buffet's Top 10 consumer routing roadmap, Raycast is ranked #3 overall (behind Obsidian at #1 and Brave Browser Leo at #2) and earns a top-tier ★★★ fit rating. It is recognized as the premier tool for delivering quick, system-wide desktop accessibility.", "434": "Token Buffet categorizes consumer integrations into three implementation tiers:", "435": "Re-pointing an endpoint setting in an existing third-party app with zero custom code.", "436": "Building a lightweight local script or bot bridge where no native consumer app exists.", "437": "Documenting non-routable tools to set clear user expectations. Raycast is classified under Delivery Tier A, as connecting it requires only a quick endpoint edit inside Raycast's existing settings menu.", "438": "The documentation establishes a strict distinction between vendor-locked platforms and customizable desktop tools:", "439": "Web platforms like ChatGPT web, Gemini web, Claude.ai web, Perplexity, Notion AI, Grammarly, and Canva Magic do not allow changing their API endpoints and cannot be routed to local bridges.", "440": "Token Buffet focuses on tools like Raycast that explicitly feature BYOM (Bring Your Own Model) or local Ollama endpoint fields, providing everyday desktop AI capabilities backed by subscription quotas.", "441": "By connecting Raycast to port 8090, non-technical users gain instant, system-wide desktop access to flat-rate subscription AI. Rather than paying per-token API bills, every desktop shortcut or launcher query is dynamically routed to the best available provider subscription (Claude, GPT, Gemini, or Grok) based on task complexity and remaining account headroom.", "442": "In the larger context of the Token Buffet AI Subscription Hub, Thunderbird represents a key consumer target for private email drafting, reply generation, and inbox summarization. While developer tools focus on coding and terminal automation, integrating Thunderbird demonstrates how flat-rate command-line interface (CLI) subscriptions—such as Claude Code, Codex CLI, Grok Build, and Gemini Antigravity—can power everyday communication tasks for regular, non-technical users without sending email data to vendor clouds or incurring per-token API bills. Below is a detailed breakdown of what the sources state regarding Thunderbird's technical setup, implementation workflows, roadmap placement, and strategic privacy value.", "443": "Thunderbird is a widely used, open-source desktop email client. Within Token Buffet's consumer architecture, it delivers private email assistance through third-party extension bridges:", "444": "Right-clicking an incoming email message inside Thunderbird invokes an extension (such as \"Ollama Compose\" or AI Emaily) to draft a contextual reply.", "445": "Summarizing long email threads, extracting key action items, and adjusting tone directly within the message composition window.", "446": "Email text and sensitive correspondence remain on the user's local machine or travel securely through local CLI proxy tunnels rather than being analyzed by cloud-locked web platforms or third-party tracking services.", "447": "Connecting Thunderbird to Token Buffet follows the platform's Universal Configuration Rule for Ollama-compatible applications:", "448": "Inside the \"Ollama Compose\" extension settings, set the server host address to http://127.0.0.1:8090 (Ollama host format).", "449": "Enter one of Token Buffet's abstract semantic performance tiers—fast (Quick), medium (Balanced), or reasoning (Best). The Smart Router advertises these tiers via /api/tags and automatically dispatches email prompts to whichever connected subscription backend currently holds the highest remaining quota headroom.", "450": "Enter any dummy placeholder string (e.g., ollama), as request authentication is handled internally by the bridge.", "451": "Token Buffet categorizes consumer application delivery into three implementation tiers based on development effort and value:", "452": "Re-pointing the endpoint setting inside Thunderbird's \"Ollama Compose\" extension to port 8090. This provides instant, right-click reply drafting with zero custom code.", "453": "For environments where extensions are not used, Token Buffet proposes a lightweight local IMAP background script. The script fetches unread emails, routes them through port 8090, and automatically saves AI-generated reply drafts directly into the user's IMAP Drafts folder.", "454": "Within Token Buffet's strategic roadmap for non-technical everyday software, Thunderbird occupies a distinct position:", "455": "On the Top 10 consumer routable targets table, Thunderbird is ranked #7 with a ★★ fit rating for \"everyday email\" utility. #5 in Development Priority: It is positioned #5 in the recommended integration priority sequence for pre-configured integrations/ app types (following #1 Obsidian, #2 Brave Browser Leo, #3 Home Assistant, and #4 Joplin/Logseq).", "456": "Thunderbird forms one of Token Buffet's three core consumer demonstration stories alongside Unified Chat (Open WebUI) and Journaling (Plume / Obsidian Wiki).", "457": "Routable Consumer App Comparison | Priority | Application | Category / Feature | Connection Method | Delivery Tier | Strategic Fit | | --- | --- | --- | --- | --- | --- | |  | Obsidian | Knowledge Vault & Wikilinks | karpathywiki plugin → :8090 | Tier A | ★★★ Flagship (Completed) | |  | Brave Leo | Browser Page Summaries | BYOM Settings → :8090/v1 | Tier A | ★★★ Top Browser Target | |  | Raycast | Desktop Shortcuts & Commands | Custom Provider → :8090 | Tier A | ★★★ System Shortcuts | |  | Home Assistant | Voice Control & Smart Home Agent | Native Ollama Integration → :8090 | Tier A | ★★★ Voice Assistant | | 5/6 | Joplin / Logseq | Note Chat & Outlining | Plugin Settings → :8090/v1 | Tier A | ★★ Non-Obsidian Notes | |  | Thunderbird | Private Email Drafting | \"Ollama Compose\" → :8090 | Tier A / B | ★★ Everyday Private Email |", "458": "In the larger context of the Token Buffet AI Subscription Hub, Joplin and Logseq represent key consumer integrations for note-taking, document summarization, and interactive note chat. While Obsidian serves as Token Buffet's flagship knowledge integration, Joplin and Logseq extend subscription-powered AI (Claude, ChatGPT, Gemini, and Grok) to individuals who prefer open-source note-taking tools or privacy-focused outliner workflows.", "459": "Joplin is a widely used open-source note-taking and markdown application. Within Token Buffet's consumer architecture, it provides local note chat and automated summarization capabilities:", "460": "Joplin connects to local LLM backends through community plugins such as Jarvis, NoteLLM, or the Joplin AI Agent.", "461": "Enables users to chat directly with their notes, draft prose, summarize lengthy documents, and extract action items without paying per-token API fees or buying separate developer keys.", "462": "The plugin's base URL is set to Token Buffet's OpenAI-compatible endpoint at http://127.0.0.1:8090/v1, with the target model set to one of Token Buffet's abstract semantic performance tiers.", "463": "Logseq is a privacy-first, open-source outliner and knowledge-management application. It integrates AI capabilities directly into block-based outliner workflows:", "464": "Connects via plugins such as logseq-copilot or third-party local AI integration plugins.", "465": "Delivers block-level writing assistance, document summarization, note chat, and automated concept synthesis directly within structured outline nodes.", "466": "The plugin setting points to Token Buffet's Ollama or OpenAI-compatible endpoint at http://127.0.0.1:8090/v1.", "467": "Both Joplin and Logseq connect to Token Buffet seamlessly by adhering to the platform's Universal Configuration Rule for routable applications:", "468": "Set the plugin's base URL / server host to http://127.0.0.1:8090 (for Ollama host formats) or http://127.0.0.1:8090/v1 (for OpenAI-compatible formats).", "469": "Select an abstract semantic model tier—fast (Quick), medium (Balanced), or reasoning (Best). The local router populates dropdowns cleanly via /v1/models or /api/tags and dispatches prompts based on available quota headroom or user preferences.", "470": "Use any dummy placeholder string (e.g., ollama). Delivery Tier Classification Token Buffet categorizes consumer app delivery into three implementation tiers based on development effort and value:", "471": "Re-pointing an endpoint field in an existing, routable third-party app.", "472": "Building a lightweight local script or bot where no native consumer app exists.", "473": "Documenting non-routable tools to set clear user expectations. Both Joplin and Logseq belong to Delivery Tier A, requiring zero custom code creation—simply re-pointing the plugin's API base URL field to port 8090.", "474": "Within Token Buffet's strategic roadmap for non-technical users, Joplin and Logseq fulfill a distinct role:", "475": "On the Top 10 consumer routable targets list, Joplin is ranked #5 and Logseq is ranked #6, both earning a ★★ fit rating.", "476": "They are positioned #4 in the recommended integration priority sequence (following #1 Obsidian, #2 Brave Browser Leo, and #3 Home Assistant).", "477": "Their primary strategic purpose is to \"round out the notes story for non-Obsidian users\". By supporting Joplin and Logseq alongside Obsidian, Token Buffet ensures that users across different note-taking paradigms (standard markdown notebooks, outliners, and Karpathy-style wikis) can leverage flat-rate subscription AI quotas across their personal knowledge bases."};

  function reEscape(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  // Escape text for safe HTML injection into a result row.
  function htmlEscape(s){
    return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }
  // Bold the matched substring within a label (case-insensitive), HTML-escaped.
  function highlight(label, q){
    const i = label.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return htmlEscape(label);
    return htmlEscape(label.slice(0, i)) + '<mark>' +
      htmlEscape(label.slice(i, i + q.length)) + '</mark>' + htmlEscape(label.slice(i + q.length));
  }

  // A highlighted excerpt of the description around the first match.
  function snippet(n, q){
    const i = n.plainLower.indexOf(q.toLowerCase());
    const start = Math.max(0, i - 30);
    const text = (start ? '…' : '') + n.plain.slice(start, start + 90 + q.length);
    return highlight(text, q);
  }

  function runSearch(q){
    q = q.trim();
    searchWrap.classList.toggle('has-text', q.length > 0);
    if (!q){ closeSearch(); return; }
    const ql = q.toLowerCase();
    if (searchMode === 'content'){
      searchMatches = SEARCH_INDEX
        .filter(n => n.plainLower.includes(ql))
        .sort((a, b) => a.plainLower.indexOf(ql) - b.plainLower.indexOf(ql))
        .slice(0, SEARCH_MAX);
      searchActive = searchMatches.length ? 0 : -1;
      renderSearch(q);
      searchWrap.classList.add('open');
      return;
    }
    // Rank: label starts with query first, then earliest match position, then shorter label.
    searchMatches = SEARCH_INDEX
      .filter(n => n.lower.includes(ql))
      .sort((a, b) => {
        const sa = a.lower.startsWith(ql), sb = b.lower.startsWith(ql);
        if (sa !== sb) return sa ? -1 : 1;
        const pa = a.lower.indexOf(ql), pb = b.lower.indexOf(ql);
        if (pa !== pb) return pa - pb;
        return a.label.length - b.label.length;
      })
      .slice(0, SEARCH_MAX);
    searchActive = searchMatches.length ? 0 : -1;
    renderSearch(q);
    searchWrap.classList.add('open');
  }

  function renderSearch(q){
    if (!searchMatches.length){
      searchResults.innerHTML = '<div class="sr-empty">' +
        (searchMode === 'content' ? 'No matching descriptions' : 'No matching concepts') + '</div>';
      return;
    }
    searchResults.innerHTML = searchMatches.map((n, i) =>
      `<div class="sr-item${i === searchActive ? ' active' : ''}" role="option" data-id="${n.id}">` +
        `<span class="sr-dot" style="background:${hexOf(n.key)}"></span>` +
        `<span class="sr-text">` +
          `<span class="sr-label">${searchMode === 'content' ? htmlEscape(n.label) : highlight(n.label, q)}</span>` +
          (searchMode === 'content' ? `<span class="sr-snip">${snippet(n, q)}</span>`
            : (n.branch ? `<span class="sr-branch">${htmlEscape(n.branch)}</span>` : '')) +
        `</span>` +
      `</div>`).join('');
  }

  function closeSearch(){
    searchWrap.classList.remove('open');
    searchResults.innerHTML = '';
    searchMatches = []; searchActive = -1;
  }

  // Reveal + select + deep-link the chosen node, then dismiss the results (keep the query).
  function chooseSearch(id){
    if (id == null) return;
    revealAndSelect(id);
    pushHash(id);
    closeSearch();
    searchInput.blur();
  }

  function setActive(i){
    if (!searchMatches.length) return;
    searchActive = (i + searchMatches.length) % searchMatches.length;
    [...searchResults.children].forEach((el, idx) => el.classList.toggle('active', idx === searchActive));
    const el = searchResults.children[searchActive];
    if (el) el.scrollIntoView({block: 'nearest'});
  }

  const searchModeBtn = document.getElementById('search-mode');
  searchModeBtn.addEventListener('click', () => {
    searchMode = searchMode === 'concepts' ? 'content' : 'concepts';
    searchModeBtn.textContent = searchMode === 'concepts' ? 'Concepts' : 'Content';
    searchInput.placeholder = searchMode === 'concepts' ? 'Search concepts…' : 'Search descriptions…';
    runSearch(searchInput.value);
    searchInput.focus();
  });
  searchInput.addEventListener('input', () => runSearch(searchInput.value));
  searchInput.addEventListener('focus', () => { if (searchInput.value.trim()) runSearch(searchInput.value); });
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown'){ e.preventDefault(); setActive(searchActive + 1); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); setActive(searchActive - 1); }
    else if (e.key === 'Enter'){ e.preventDefault(); if (searchMatches[searchActive]) chooseSearch(searchMatches[searchActive].id); }
    else if (e.key === 'Escape'){ e.preventDefault(); if (searchWrap.classList.contains('open')) closeSearch(); else { searchInput.value = ''; searchWrap.classList.remove('has-text'); searchInput.blur(); } }
  });
  searchResults.addEventListener('click', (e) => {
    const item = e.target.closest('.sr-item');
    if (item) chooseSearch(item.dataset.id);
  });
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchWrap.classList.remove('has-text');
    closeSearch();
    searchInput.focus();
  });
  // Click outside the search box dismisses the dropdown.
  document.addEventListener('click', (e) => { if (!searchWrap.contains(e.target)) closeSearch(); });
  // Global "/" focuses search (unless already typing in an input).
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== searchInput && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
      e.preventDefault(); searchInput.focus();
    }
  });

  // On load: reveal a #slug deep link, or otherwise frame the tree. Uses setTimeout (not
  // requestAnimationFrame, which is paused in background tabs) and retries briefly until the
  // map has rendered. The initial fit is needed because markmap.create doesn't center the
  // tree into the (panel-narrowed) map area on its own — the root ends up clipped off-left.
  (function initView(tries){
    if (mm && mm.state && mm.state.data){
      if (location.hash) gotoHash(); else mm.fit();
      return;
    }
    if (tries > 0) setTimeout(() => initView(tries - 1), 50);
  })(40);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Enabled Productivity Apps</title>
<style>
  :root{
    --ink:#eef1f7; --muted:#9aa4b6; --bg:#191c24; --panel-bg:#1f232d;
    --card:#262b37; --line:#333a49; --panel-w:400px;

    /* Default branch palette. builder.py binds each legend key to a slot in order
       (--branch-<key>:var(--pal-N)); the injected block lives near the end of this style
       element (below). Colors carry NO meaning — they only need to be distinct and readable on
       the dark canvas. A project map.css can override any of these. Keep the count in sync with
       PALETTE_SIZE in builder.py. --branch-navy is the structural / unbranched fallback. */
    --pal-1:#6d4aff; --pal-2:#0e97b7; --pal-3:#1f8a5b; --pal-4:#e0701c;
    --pal-5:#c2255c; --pal-6:#b08900; --pal-7:#2f7fd1; --pal-8:#d1477a;
    --branch-navy:#26324a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  #app{display:flex;flex-direction:column;height:100vh}

  /* Header */
  header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:#20242e;border-bottom:1px solid var(--line);flex:0 0 auto}
  .logo{width:34px;height:34px;border-radius:9px;background:#2f3646;display:grid;place-items:center;flex:0 0 auto}
  .logo svg{width:20px;height:20px}
  .brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .brand p{font-size:11px;margin:0;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .legend{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
  /* Persistent "Download PDF" link in the header. Points at the docs/downloads/ PDF render of
     the source doc (builder.py DLPDF). The legend's margin-left:auto pushes both it and this
     button to the right edge; on narrow screens (legend hidden) the media query re-adds the
     auto push so this button stays right-aligned. */
  .dl-md{margin-left:16px;display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;
    font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;
    color:#c3cad8;background:#2b3040;border:1px solid #454d60;border-radius:8px;padding:6px 11px}
  .dl-md:hover{background:#343b4a;border-color:#6b7286;color:#fff}
  .dl-md svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* Main split — map on the left, description panel down the right side */
  main{flex:1 1 auto;display:flex;flex-direction:row;min-height:0}
  #map{flex:1 1 auto;position:relative;min-height:0;min-width:0;background:var(--bg)}
  #mm{width:100%;height:100%}
  #hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:12.5px;color:var(--muted);background:#262b37cc;padding:6px 12px;border-radius:8px;pointer-events:none;white-space:nowrap}
  #hint .hint-adv{color:#ffd166;font-weight:800}

  /* Rounded block nodes (NotebookLM style), tinted per branch */
  .markmap-node{cursor:pointer}
  .markmap-node > line{display:none}                 /* hide default underline segment */
  /* markmap fills each foreignObject with a ~10000px-wide inner div (its width-measurement trick)
     that would otherwise capture hover across the whole row. So make the foreignObject inert and
     re-enable pointer events only on the visible pill + chevron. */
  .markmap-foreign{border-bottom:none !important;overflow:visible;pointer-events:none}
  .markmap-foreign span.pill,.markmap-foreign span.fold-toggle{pointer-events:auto}
  .markmap-foreign span.pill{
    display:inline-block;padding:8px 14px;border-radius:10px;
    background:color-mix(in srgb, var(--nc,var(--branch-navy)) 30%, #2a2f3c);
    color:#f4f6fb;font-weight:600;font-size:13px;line-height:1.3;white-space:nowrap;
    border:1px solid color-mix(in srgb, var(--nc,var(--branch-navy)) 55%, transparent);
    box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  /* Per-branch tint: builder.py adds a `b-<key>` class to each pill and generates the
     `.pill.b-<key>{--nc:…}` bindings (see the block near the end of this style element). No class
     => --nc unset => --branch-navy. Those rules only set --nc, so the higher-specificity rule
     above (which reads --nc) doesn't override them. */
  .markmap-foreign span.pill.sel{
    outline:2px solid var(--nc,var(--branch-navy));
    box-shadow:0 0 0 4px color-mix(in srgb, var(--nc,var(--branch-navy)) 35%, transparent);
  }
  .markmap-foreign span.pill code{background:rgba(255,255,255,.16);color:#fff;padding:0 4px;border-radius:4px}
  /* Star marker on nodes the author flagged with a `-*-` token */
  .markmap-foreign span.pill .adv{color:#ffd166;font-weight:800;font-size:1.15em;line-height:0;margin-left:5px;vertical-align:middle}
  /* Custom fold chevron (builder.py CHEVRON), a sibling of the pill. Bigger / easier target
     than markmap's native fold circle, which we hide. The click listener calls
     mm.toggleNode() on it; direction follows markmap's `.markmap-fold` class on the node. */
  .markmap-node > circle{display:none}               /* hide markmap's native fold dot */
  .markmap-foreign span.fold-toggle{
    display:inline-grid;place-items:center;width:20px;height:20px;margin-left:8px;
    border-radius:50%;background:#2b3040;border:1px solid #565d70;cursor:pointer;vertical-align:middle;
  }
  .markmap-foreign span.fold-toggle:hover{background:#343b4a;border-color:#6b7286}
  .markmap-foreign span.fold-toggle svg{
    width:12px;height:12px;fill:none;stroke:#c7cede;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;
  }
  g.markmap-node.markmap-fold span.fold-toggle svg{transform:rotate(180deg)}

  /* NotebookLM-style vertical toolbar (top-left) */
  #tools{position:absolute;top:18px;left:18px;display:flex;flex-direction:column;gap:12px;z-index:6}
  #tools .grp{display:flex;flex-direction:column;background:#2a2f3b;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.45);overflow:hidden}
  #tools .grp.round{border-radius:50%}
  #tools button{width:44px;height:44px;display:grid;place-items:center;background:transparent;border:0;color:#c3cad8;cursor:pointer;padding:0}
  #tools button:hover{background:#343b4a;color:#fff}
  #tools svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* Search — floating box top-center of the map. Filters node labels; a result reveals +
     selects + deep-links the node via the same revealAndSelect/pushHash used by hash links. */
  #search{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:7;width:340px;max-width:calc(100% - 132px)}
  #search-box{display:flex;align-items:center;gap:8px;background:#2a2f3b;border:1px solid #3c4354;
    border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.45);padding:9px 12px}
  #search-box:focus-within{border-color:#6b7286}
  #search-box svg{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:#9aa4b6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #search-input{flex:1 1 auto;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:13.5px;font-family:inherit}
  #search-input::placeholder{color:var(--muted)}
  #search-mode{flex:0 0 auto;background:#343b4a;border:1px solid #454d60;border-radius:8px;color:#c3cad8;
    font:600 11px/1 inherit;font-family:inherit;padding:5px 8px;cursor:pointer}
  #search-mode:hover{background:#3d4658;color:#fff}
  .sr-snip{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sr-snip mark{background:transparent;color:#ffd166;font-weight:700}
  #search-clear{flex:0 0 auto;display:none;background:transparent;border:0;color:var(--muted);cursor:pointer;
    font-size:18px;line-height:1;padding:0 2px}
  #search-clear:hover{color:var(--ink)}
  #search.has-text #search-clear{display:block}
  #search-results{margin-top:8px;background:#232833;border:1px solid #3c4354;border-radius:12px;
    box-shadow:0 8px 22px rgba(0,0,0,.5);overflow:hidden auto;max-height:min(60vh,420px);display:none}
  #search.open #search-results{display:block}
  .sr-item{display:flex;align-items:center;gap:10px;padding:9px 13px;cursor:pointer;border-bottom:1px solid #2c313d}
  .sr-item:last-child{border-bottom:none}
  .sr-item.active,.sr-item:hover{background:#2f3646}
  .sr-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .sr-text{flex:1 1 auto;min-width:0}
  .sr-label{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sr-label mark{background:transparent;color:#ffd166;font-weight:700}
  .sr-branch{font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sr-empty{padding:12px 14px;font-size:13px;color:var(--muted);font-style:italic}

  /* Drag handle between map and panel; sets --panel-w (double-click resets to the default). */
  #resizer{flex:0 0 6px;margin:0 -3px;z-index:6;cursor:col-resize;background:transparent}
  #resizer:hover,#resizer.drag{background:#6b728655}
  /* Panel — column on the right, full height; width from --panel-w (map.css or drag) */
  #panel{flex:0 0 var(--panel-w);width:var(--panel-w);height:100%;padding:22px;overflow-y:auto;background:var(--panel-bg);border-left:1px solid var(--line)}
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--ink);border-radius:14px;padding:22px 22px 24px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
  .copy-link{position:absolute;top:16px;right:16px;display:none;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
    color:#c3cad8;background:#2b3040;border:1px solid #454d60;border-radius:8px;padding:5px 10px;cursor:pointer}
  .copy-link:hover{background:#343b4a;border-color:#6b7286;color:#fff}
  .copy-link.show{display:inline-flex}
  .copy-link svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  .card h2{font-size:20px;line-height:1.25;margin:0 0 14px;color:var(--ink)}
  .desc{font-size:14.5px;line-height:1.65;color:#c4ccda}
  .desc code{background:#2f3644;color:#c7b8ff;padding:1px 6px;border-radius:5px;font-size:.88em}
  .desc>:first-child{margin-top:0}
  .desc>:last-child{margin-bottom:0}
  .desc p{margin:0 0 12px}
  .desc h1,.desc h2,.desc h3,.desc h4{color:var(--ink);line-height:1.3;margin:20px 0 8px}
  .desc h1,.desc h2{font-size:17px}.desc h3{font-size:15.5px}.desc h4{font-size:14.5px}
  .desc ul,.desc ol{margin:0 0 12px;padding-left:22px}
  .desc li{margin:3px 0}
  .desc blockquote{margin:0 0 12px;padding-left:14px;border-left:3px solid var(--line);color:var(--muted)}
  .desc pre{background:#2f3644;padding:12px;border-radius:8px;overflow-x:auto}
  .desc pre code{background:none;padding:0}
  .desc table{border-collapse:collapse;margin:0 0 12px;font-size:13.5px}
  .desc th,.desc td{border:1px solid var(--line);padding:5px 9px;text-align:left}
  .desc hr{border:0;border-top:1px solid var(--line);margin:16px 0}
  .empty{color:var(--muted);font-style:italic}
  .desc a{color:#8fa3c4;text-underline-offset:2px}

  /* Links in the panel description. Muted slate-blue with a soft underline so they read clearly
     on dark instead of the glaring default browser blue. */
  .desc a{color:#8fa3c4;font-weight:500;text-decoration:underline;
    text-decoration-color:#8fa3c455;text-underline-offset:2px}
  .desc a:hover{color:#b3c2de;text-decoration-color:#b3c2de}

  @media (max-width:860px){
    .legend{display:none}
    .dl-md{margin-left:auto}
    main{flex-direction:column}
    #resizer{display:none}
    #panel{flex:0 0 42vh;width:100%;height:42vh;border-left:none;border-top:1px solid var(--line)}
  }

  /* Per-map branch bindings: builder.py maps each legend key to a --pal-* slot above, then
     appends any project map.css after (which overrides via the cascade). */
:root{
    --branch-b1:var(--pal-1);
    --branch-b2:var(--pal-2);
    --branch-b3:var(--pal-3);
    --branch-b4:var(--pal-4);
    --branch-b5:var(--pal-5);
    --branch-b6:var(--pal-6);
  }
  .markmap-foreign span.pill.b-b1{--nc:var(--branch-b1)}
  .markmap-foreign span.pill.b-b2{--nc:var(--branch-b2)}
  .markmap-foreign span.pill.b-b3{--nc:var(--branch-b3)}
  .markmap-foreign span.pill.b-b4{--nc:var(--branch-b4)}
  .markmap-foreign span.pill.b-b5{--nc:var(--branch-b5)}
  .markmap-foreign span.pill.b-b6{--nc:var(--branch-b6)}
:root{--panel-w:720px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round">
        <circle cx="6" cy="12" r="2.3" fill="#fff" stroke="none"/>
        <circle cx="17" cy="6" r="2.3" fill="#fff" stroke="none"/>
        <circle cx="17" cy="18" r="2.3" fill="#fff" stroke="none"/>
        <line x1="8" y1="11" x2="15" y2="7"/><line x1="8" y1="13" x2="15" y2="17"/>
      </svg>
    </div>
    <div class="brand">
      <h1>Token Buffet</h1>
      <p>Interactive Documentation</p>
    </div>
    <div class="legend" id="legend"></div>
    <a class="dl-md" href="downloads/productivity-apps.pdf" download title="Download this map's document as PDF">
      <svg viewBox="0 0 24 24"><path d="M12 4v10"/><polyline points="8 11 12 15 16 11"/><path d="M5 19h14"/></svg>
      <span>PDF</span>
    </a>
  </header>
  <main>
    <div id="map">
      <div id="search">
        <div id="search-box">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
          <input id="search-input" type="text" placeholder="Search concepts…" autocomplete="off" spellcheck="false" aria-label="Search concepts">
          <button id="search-mode" title="Search concept names or description text">Concepts</button>
          <button id="search-clear" title="Clear search" aria-label="Clear search">&times;</button>
        </div>
        <div id="search-results" role="listbox"></div>
      </div>
      <div id="hint">Click a node to read about it</div>
      <svg id="mm"></svg>
    </div>
    <div id="resizer" title="Drag to resize; double-click to reset"></div>
    <aside id="panel">
      <div class="card" id="card">
        <button class="copy-link" id="copy-link" title="Copy a link to this concept">
          <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
          <span id="copy-link-text">Copy link</span>
        </button>
        <button class="copy-link" id="open-win" style="right:128px" title="Open this concept in a new window">
          <svg viewBox="0 0 24 24"><path d="M14 3h7v7"/><path d="M21 3l-9 9"/><path d="M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg>
          <span>New window</span>
        </button>
        <p class="kicker" id="p-kicker">Token Buffet</p>
        <h2 id="p-title">Select a concept</h2>
        <div class="desc" id="p-desc"><span class="empty">Click any node in the map to read its description here.</span></div>
      </div>
    </aside>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

  const DESC  = {"0": "Token Buffet converts flat-rate command-line interface (CLI) subscriptions, such as Claude Code, Codex CLI, Grok Build, and Gemini Antigravity (`agy`), into a local API that speaks the OpenAI, Ollama, Anthropic, and Gemini wire formats. Downstream apps and CLI agents talk HTTP to one local address, and Token Buffet shells out to each vendor's logged-in CLI, so no per-token API keys or usage bills are involved. The whole system is config-driven: adding or changing a provider means editing a declarative `registered_providers/<name>/config.json`, and the Python engine has no provider-specific branches. tbuffet add-app obsidian my-vault --path \"/path/to/vault\" --vault-type finance-conference", "1": "All services bind to `127.0.0.1`, never `localhost`.", "2": "One proxy per provider (Grok 8000, Claude 8001, Codex 8002, Antigravity 8003). Each proxy turns chat requests into CLI invocations and parses the CLI output back into chat chunks.", "3": "The single endpoint clients point at. It maps a semantic tier to provider backends and balances load across subscriptions.", "4": "A status and configuration view of the fleet, quotas, models, apps, router settings, and request activity.", "5": "Clients request one of three tiers instead of a vendor model string: `fast` (Quick), `medium` (Balanced), or `reasoning` (Best).", "6": "Routes a tier to the backend with the most remaining quota, skipping depleted or stopped backends.", "7": "Ignores quota and follows a global `custom_order` provider preference list.", "8": "Failures before streaming starts advance to the next candidate, and an unresolvable request falls back to the medium tier or returns HTTP 503.", "9": "An extractor subsystem reads each vendor CLI's interactive `/usage` and model screens through a pseudo-console, since no API exposes them. Each proxy publishes its usage, models, and run status under `data/providers_status/`. The router polls each running proxy's `/usage` and `/models` endpoints, and the dashboard shows the results as quota gauges and status dots.", "11": "Obsidian (the karpathywiki plugin) and Claudia are registered through a three-layer configuration cascade from `integrations/` to `registered_apps/`.", "12": "Claude Code, Codex CLI, Grok Build, and Gemini Antigravity run in isolated workspaces pointed at the router.", "13": "Any app with a custom OpenAI or Ollama endpoint field can connect with a base URL of `http://127.0.0.1:8090` or `http://127.0.0.1:8090/v1`, a tier as the model name, and a dummy API key.", "14": "Token Buffet runs as three long-running process types, all on loopback `127.0.0.1`, with an extractor subsystem feeding them status data.", "16": "Built on Python's standard library `http.server`, one proxy per vendor CLI (Grok 8000, Claude 8001, Codex 8002, Antigravity 8003). A proxy binds its port first, then reads its own usage and models in a background thread.", "17": "The central gateway. It accepts OpenAI, Ollama, Anthropic, and Gemini requests, resolves a semantic tier to a backend, and forwards to the live port each proxy published. A standalone router launch defaults to port 11434, while `tbuffet start` binds it to 8090.", "18": "Also standard library only, with static files in `dashboard/static/`. It renders whatever it finds on disk and contains no hardcoded provider or app logic.", "19": "The extractor drives each vendor CLI through a pseudo-console to capture its `/usage` and model screens, then parses the saved text with the provider's configured regexes. Results are exported asynchronously to `data/providers_status/` as `<provider>_usage.json`, `<provider>_models.json`, and `<provider>_run_status.json`, so live requests never wait on a scrape.", "21": "publish their bound port and state to `<provider>_run_status.json`.", "22": "polls each running proxy's `/usage` and `/models` endpoints at startup and every `--refresh-interval` seconds (default 1,800).", "23": "reads the exported status files to draw gauges, status dots, and model tables.", "24": "Non-streaming requests are buffered, spilling to disk above 1 MiB so failed attempts can be retried. The router only uses a provider marked running whose port is listening, so stale files after a forced stop are ignored.", "25": "In the architecture of the Token Buffet AI Subscription Hub, the Control Center Dashboard operating on port 8080 serves as the central operator console and management interface. While the CLI proxies handle vendor communications and the Smart Router Gateway (port 8090) directs prompt traffic, the port 8080 dashboard provides a unified UI to monitor fleet health, manage app registrations, inspect quotas, and configure system routing. Served at http://127.0.0.1:8080/ via python -m tokenbuffet.dashboard or the tbuffet start fleet launcher, the dashboard is strictly restricted to local loopback connections for security.", "26": "The port 8080 dashboard embodies the foundational engineering principles of the Token Buffet ecosystem:", "27": "Built strictly using Python’s standard library (http.server in dashboard/server.py, with static files in dashboard/static/), requiring zero external web frameworks, JavaScript build steps, or heavyweight server dependencies.", "28": "The dashboard contains no hardcoded provider or application logic. Instead, it dynamically renders whatever it discovers on disk by reading directly from filesystem sources of truth:", "29": "Read from data/providers_status/<provider>_run_status.json.", "30": "Read from data/providers_status/<provider>_usage.json and <provider>_models.json.", "31": "Read from registered_providers/<provider>/config.json.", "32": "Read from config/router_config.json.", "33": "Walked from registered_apps/<type>/<name>/app_meta.json and app_config.json.", "34": "Rather than duplicating business logic inside web handlers, the dashboard orchestrates existing operational tools. App registration shells out to integrations/register.py, and re-applying settings invokes the workspace instance's configure.py script.", "35": "To accommodate both non-technical users and technical operators, the dashboard utilizes a Progressive Disclosure design philosophy. A single header toggle (\"Advanced mode\") toggles a body.adv CSS class on the page, revealing administrative panels and dense technical data without requiring a page reload or separate build. ```text ┌─────────────────────────────────────────────────────────────────────────┐ │ Token Buffet — AI Subscription Hub                      [ Advanced ◯ ]  │ ├─────────────────────────────────────────────────────────────────────────┤ │  ● All systems go                                                       │ │                                                                         │ │  ┌─ Claude ──────┐  ┌─ Codex ───────┐  ┌─ Grok ───────┐  ┌─ Agy ──────┐ │ │  │  ✓ ready      │  │  ✓ ready      │  │  ⚠ log in    │  │  ✓ ready   │ │ │  │  41% quota    │  │  68% quota    │  │  -- quota    │  │  12% quota │ │ │  └───────────────┘  └───────────────┘  └───────────────┘  └───────────┘ │ │                                                                         │ │                       [  ▶  Start Everything  ]                         │ │                                                                         │ │  Connected Apps:                                                        │ │  📓 LLM Wiki Play · finance-conference · ●                      [Open]  │ │  ＋ Add an App                                                          │ └─────────────────────────────────────────────────────────────────────────┘ ``` Basic Surface (Default View)", "37": "Displays an immediate visual indicator of overall network health (e.g., \"All systems go\" or \"All services online\").", "38": "Displays remaining capacity percentages (remaining_pct) and reset countdowns for each provider account, sorted by tightest remaining quota.", "39": "Features visual status dots (🟢 up/ready, 🟡 attention needed, 🔴 down) alongside a one-click \"Start everything\" button.", "40": "Displays registered client tools (such as Obsidian vaults or Claudia second-brain workspaces) with direct \"Open\" launchers. Advanced Mode (Operator View) Toggling Advanced Mode reveals granular system details and control surfaces:", "41": "Displays exact Process IDs (PIDs), configured ports, and live bound ports for the router (8090), dashboard (8080), and CLI proxies (8000–8003+).", "42": "Enables launching, killing, or stopping specific proxies, as well as adjusting background usage refresh intervals.", "43": "Opens inline JSON editors for app_meta.json, app_settings.json, and vault_types.json.", "44": "Exposes tool checkboxes (updating tools.enabled), sandbox environment toggles, model re-scraping, and full model availability tables.", "45": "The dashboard organizes management tasks across these functional panels:", "46": "Monitors active loopback services through the /api/state payload. It tracks provider status (starting, running, failed, stopped) published in data/providers_status/<provider>_run_status.json and surfaces process management controls.", "47": "Manages client application integrations through a step-by-step registration wizard (/api/apps/register):", "48": "Choose from available integration types (obsidian, claudia, abject, or a chatbot CLI preset: Claude Code, Codex, Grok, Antigravity).", "49": "Browse or enter the local workspace directory (e.g., Obsidian vault path or Claudia root) and assign an instance label.", "50": "Select a preset schema from vault_types.json (such as finance-conference, research-papers, or daily-notes).", "51": "Spawns integrations/register.py as a subprocess to  configuration templates, substitute path placeholders, run initialization scripts, and write native app configuration files.", "52": "Provides an overview of connected vendor CLI subscriptions (Claude Code, Codex CLI, Grok Build, Gemini Antigravity). Displays account quota gauges, model lists from <provider>_models.json, and allows operators to toggle supported provider tools (e.g., Bash, Read, Edit, WebSearch). On Windows or macOS, clicking \"Log in\" triggers an interactive terminal session to handle vendor authentication TUIs.", "53": "Allows operators to configure router settings stored in config/router_config.json:", "54": "Switch between Usage Mode (load-balancing prompts to the backend with the highest remaining quota percentage) and Custom Mode (following a strict provider preference order).", "55": "Drag or reorder the fallback sequence (custom_order) across backends.", "56": "Inspect and adjust model mappings for the fast, medium, and reasoning semantic tiers.", "57": "Displays a banner noting that routing changes require a router process restart, as active router instances retain a startup snapshot of tier configurations.", "58": "Tracks API request history by parsing session logs (logs/<provider>/proxy/sessions/req_*.log). It correlates request IDs with provider proxies and displays response status without logging or exposing private prompt or completion text.", "59": "The dashboard exposes a set of JSON POST control endpoints and GET state endpoints, listening strictly on 127.0.0.1:8080: | Endpoint | Method | Operational Purpose | | --- | --- | --- | | /api/state | GET | Returns providers, router configuration, registered apps, app types, and fleet status in one payload. | | /api/router | POST | Reads or rewrites router mode, custom order, and tier configurations in router_config.json. | | /api/apps/register | POST | Invokes integrations/register.py to scaffold and register a new client app workspace. | | /api/apps/apply | POST | Re-applies an instance's settings to the client app. | | /api/providers/launch / /stop | POST | Launches or terminates individual CLI proxy server processes. | | /api/providers/login | POST | Opens an interactive terminal session (via AppleScript on macOS or PowerShell on Windows) for vendor CLI login. | | /api/providers/tools | POST | Updates tools.enabled inside registered_providers/<provider>/config.json. |", "60": "In the overall architecture of Token Buffet AI Subscription Hub, the Local Router Gateway operating on port 8090 serves as the central orchestration layer and API entry point. Positioned between client applications and individual provider proxies, the port 8090 gateway abstracts vendor-specific CLI mechanics into a single, standard API endpoint that dynamically distributes prompts across active subscriptions based on performance requirements and quota availability. Below is a detailed breakdown of how the Local Router on port 8090 operates within Token Buffet's core architecture.", "61": "Token Buffet divides its execution layer into three distinct process types running over local loopback (127.0.0.1):", "62": "Individual proxy servers spawned per vendor CLI (e.g., Grok on 8000, Claude on 8001, Codex on 8002, Antigravity on 8003).", "63": "The central routing gateway that receives all incoming prompts from client applications and forwards them to eligible provider proxies.", "64": "The management interface for monitoring fleet health, managing app registrations, and configuring router settings. While a direct, standalone launch of the router defaults to port 11434 (matching Ollama's native default port), the standard fleet launcher (tbuffet start or tbuffet start-router) explicitly binds the router gateway to port 8090 ```text Client Apps (Obsidian / Brave Leo / Claudia / Open WebUI) │ ▼ (Port 8090) [ Smart Router Gateway ] │ ┌───────────────┼───────────────┬───────────────┐ ▼ (Port 8000)   ▼ (Port 8001)   ▼ (Port 8002)   ▼ (Port 8003) Grok Proxy      Claude Proxy    Codex Proxy     Agy Proxy │               │               │               │ ▼               ▼               ▼               ▼ Grok CLI        Claude CLI      Codex CLI       Agy CLI ```", "65": "The router on port 8090 natively translates requests across four standard API wire formats without requiring intermediate proxy gateways:", "66": "Accepts standard chat completion (/v1/chat/completions), responses (/v1/responses), and model discovery (/v1/models) requests.", "67": "Accepts /v1/messages requests directly from Anthropic-based applications (such as Claudia or Claude Code) without additional protocol translation.", "68": "Accepts native Ollama API calls (/api/chat, /api/generate, /api/tags).", "69": "Accepts text-only GenerateContent calls (/v1beta/models/{model}:generateContent and :streamGenerateContent). Because port 8090 answers both OpenAI-compatible and Ollama formats simultaneously, any bring-your-own-model (BYOM) application can connect using a universal configuration pattern:", "70": "http://127.0.0.1:8090 (Ollama host) or http://127.0.0.1:8090/v1 (OpenAI-compatible).", "71": "Any dummy placeholder string (e.g., ollama).", "72": "Enables immediate routing for desktop interfaces (Open WebUI, Jan, Msty), knowledge tools (Obsidian karpathywiki, Joplin, Logseq, AnythingLLM), browser extensions (Brave Leo), email extensions (Thunderbird Ollama Compose), and system agents (Home Assistant, Raycast, Claudia).", "73": "Rather than requiring downstream applications to request specific vendor model strings (like claude-3-5-sonnet or grok-4.7), the router on port 8090 exposes three abstract performance tiers: fast (Quick): Suited for light autocomplete, tag extraction, or ingestion. medium (Balanced): Suited for standard chat, drafting, and daily note synthesis. reasoning (Best): Suited for complex reasoning, multi-document analysis, and deep synthesis. The router resolves these generic tiers to concrete provider models using exact model IDs frozen per provider in config/router_config.json. Those IDs are populated once from each provider's tier regex (defined in registered_providers/<provider>/config.json), matched against the models returned by that running proxy's /models endpoint. When a request hits port 8090, the router resolves the destination by tier, exact model ID, provider name, or fuzzy match, falling back to the medium tier (or returning an HTTP 503 if unresolvable).", "74": "The port 8090 router manages traffic across connected CLI proxies using two configurable load-balancing modes:", "75": "Polls each running proxy's GET /usage endpoint to identify remaining capacity. It dynamically routes incoming prompts to whichever connected provider currently holds the highest remaining usage quota percentage.", "76": "Bypasses quota sorting to follow a hardcoded provider preference order (custom_order), such as prioritizing Claude before falling back to Codex, Antigravity, or Grok. To ensure zero latency overhead during active request routing, the router never invokes TUI scrapers inline. Instead, it polls each running proxy's endpoints at startup and on a configurable background schedule (defaulting to 1,800 seconds / 30 minutes).", "77": "To maintain connection stability across local CLI backends, the router enforces strict failover mechanisms:", "78": "Automatically skips known depleted, stopped, or offline proxies.", "79": "If a proxy encounters a connection failure, rate limit (HTTP 429), or CLI execution error before streaming starts, the router advances to the next candidate provider within the tier.", "80": "Non-streaming requests are buffered in memory and spilled to disk if payload sizes exceed 1 MiB, allowing failed attempts to be retried cleanly without corrupting data.", "81": "For streaming requests (\"stream\": true), the router holds only the initial response prelude until the first text chunk arrives. Failures before text generation trigger a retry on an alternate backend, whereas errors occurring mid-stream are passed directly to the client as stream errors because partial text is already visible.", "82": "When client applications submit prompts containing function calls or tool declarations, the router delegates execution cleanly: The router passes the request to the vendor CLI with execution flags (such as --tools \"\") to request a structured tool-call decision from the model. The vendor CLI returns the tool decision to the router on port 8090, which delivers it back to the client application for local execution.", "83": "In the larger architecture of the Token Buffet AI Subscription Hub, the Proxy Runtime serves as the dedicated, provider-facing execution layer. Each connected command-line interface (CLI) subscription—such as Claude Code, Codex CLI, Grok Build, and Gemini Antigravity—is managed by an individual, lightweight HTTP proxy process. Built strictly around Python's standard library http.server, the proxy runtime embodies Token Buffet’s core design philosophy: a minimal, zero-dependency runtime that avoids heavy web frameworks or external build steps. Below is an in-depth discussion of the Proxy Runtime's design, operational responsibilities, and position within the overarching system architecture.", "84": "Token Buffet decouples local AI bridging into three primary process layers running on dedicated loopback ports:", "85": "Accepts incoming client API calls matching OpenAI (/v1), Anthropic (/v1), and Ollama (/api) wire formats.", "86": "Provides a single-page management console (also built on http.server) to monitor fleet health, manage app registrations, and control process lifecycles.", "87": "Individual proxy server processes (cli_proxy_server) spawned per vendor CLI. Each proxy binds to a configured loopback port (e.g., Grok on 8000, Claude on 8001, Codex on 8002, Antigravity on 8003) and handles direct communication with that specific vendor's interactive CLI. ```text Client App (Obsidian / Brave / Claudia) │ (Port 8090) ▼ ``` Smart Router Gateway ```text │ ├───────────────────────┬───────────────────────┐ ▼ (Port 8000)           ▼ (Port 8001)           ▼ (Port 8002) ``` Proxy (Grok Build)      Proxy (Claude Code)     Proxy (Codex CLI) ```text │                       │                       │ ▼                       ▼                       ▼ Grok CLI TUI            Claude Code TUI         Codex CLI TUI ```", "88": "The proxy server process abstracts interactive vendor CLIs into standard HTTP endpoints while managing local process isolation and health monitoring:", "90": "Each proxy converts incoming HTTP requests from the Smart Router into CLI commands and streams the output back to the router.", "91": "For non-streaming requests, proxy execution output is buffered (and spooled to disk if exceeding 1 MiB). If a non-streaming CLI execution fails, the proxy returns an HTTP 502 Bad Gateway error; for streaming requests, it emits a structured error event.", "92": "When client requests contain tool declarations, proxies invoke the vendor CLI with specific tool flags (e.g., --tools \"\") to obtain a structured tool-call decision without executing the tool locally, delegating actual execution back to the client app.", "93": "Rather than forcing the Smart Router to scrape vendor CLIs during active API requests, each proxy independently handles resource extraction:", "94": "Proxies spawn pseudo-terminal (PTY) or subcommand tasks to run vendor status commands (such as /usage and /models) inside the interactive CLI TUIs.", "95": "Extracted status metrics are written to structured JSON files in data/providers_status/: <provider>_usage.json: Tracks canonical remaining quota percentages (remaining_pct) and reset timestamps. <provider>_models.json: Lists supported underlying provider model IDs. <provider>_run_status.json: Contains the live operational status and bound port published by the proxy.", "96": "Each proxy binds its port first, then reads usage and models in a background thread and refreshes them every --refresh-interval seconds (default 1,800 seconds / 30 minutes). The Smart Router polls the proxy's /usage and /models endpoints instead of reading the status files, avoiding any latency overhead during prompt routing.", "98": "After binding its port, a proxy reads usage and models in a background thread. If the CLI displays an updater, login prompt, or unparseable screen, the read fails, the proxy records the captured reason as usage state unavailable, and it retries every 300 seconds.", "99": "A proxy advertises its status as starting, running, failed, or stopped in <provider>_run_status.json.", "100": "The Smart Router only directs traffic to proxies that are actively running and listening on their assigned ports. Stale status files from forced shutdowns or failed startups are automatically ignored.", "101": "Native vendor CLIs frequently enforce global user configuration paths and SQLite database file locks, which normally prevent running multiple concurrent sessions. To overcome this, the Proxy Runtime isolates each proxy process using dedicated sandbox directories: During execution, the proxy sets isolated session environment variables—such as GROK_HOME for Grok, CODEX_HOME for Codex, or data/provider_homes/agy for Antigravity. This sandbox isolation allows multiple downstream applications (e.g., Obsidian vaults, Claudia assistants, and browser plugins) to execute prompts in parallel without encountering database lock errors or overwriting user settings.", "102": "The Proxy Runtime integrates directly with Token Buffet's fleet management and dashboard tools:", "103": "From the dashboard at http://127.0.0.1:8080, operators can launch individual proxies, kill process IDs (PIDs), trigger terminal logins, or manage enabled tool sets via POST API endpoints (/api/providers/launch, /api/providers/stop, /api/providers/login).", "104": "On macOS (sys.platform == \"darwin\"), process lifecycle management is delegated to an isolated platform adapter (src/tokenbuffet/platforms/macos/processes.py) that uses psutil to inspect and terminate process trees reliably without relying on Linux /proc assumptions. On Windows, process tracking falls back to native command-line process scans.", "105": "In the architecture of the Token Buffet AI Subscription Hub, the Extractor Subsystem (located in src/tokenbuffet/extractors/) serves as the automated monitoring and state-capture engine. Its purpose is to periodically capture resource quotas, reset timestamps, and model capabilities from interactive command-line interface (CLI) tools—such as Claude Code, Codex CLI, Grok Build, and Gemini Antigravity—without introducing latency into live API requests. By decoupling TUI status extraction from prompt handling, the subsystem provides the structured operational data required by both the Smart Router Gateway (Port 8090) for load balancing and the Control Center Dashboard (Port 8080) for visual fleet monitoring.", "106": "Because vendor CLIs do not offer standard developer status APIs, the Extractor Subsystem relies on background automation to interact directly with vendor interfaces:", "107": "The engine spawns background pseudo-terminal tasks (using PTY/pexpect dependencies) or subcommands to issue vendor-specific status commands (such as /usage in TUI screens or grok models / /models subcommands).", "108": "Each proxy binds its port first, then reads its own usage and models in a background thread, retrying every 300 seconds on failure. If the vendor CLI displays an unexpected screen such as an updater, missing login, or unparseable interface, the read fails, the proxy records the captured reason as usage state unavailable, and the last valid usage JSON stays on disk.", "109": "Rather than performing live screen scraping when an API request hits the gateway, the Extractor Subsystem writes all captured status metrics asynchronously to structured JSON files inside data/providers_status/: <provider>_usage.json: Captures plan details (plan), timestamp (gathered_at), and period-based quota limits (usage.limits.<period>). Tracks used_pct, the canonical remaining_pct (remaining quota percentage), and reset timestamps (resets, e.g., \"October 15, 18:30\"). <provider>_models.json: Stores supported model definitions under models.available[{id, name}] alongside the default provider model. Serves as the single source of truth for populated model dropdowns, model discovery endpoints (/v1/models, /api/tags), and tier resolutions. <provider>_run_status.json: Published directly by each running proxy to advertise its bound loopback port (e.g., { \"port\": 8000 }) and process lifecycle state (starting, running, failed, or stopped).", "110": "To ensure zero latency impact on live user requests, the router and dashboard never invoke TUI scrapers directly during prompt execution:", "111": "Individual proxy servers expose GET /usage and GET /models HTTP endpoints. These endpoints return cached JSON data when fresh and re-trigger background extraction only when files are missing or stale.", "112": "The default cache lifetime is set to 1,800 seconds (30 minutes), adjustable via the --refresh-interval CLI option.", "113": "The Smart Router on port 8090 polls each active proxy's /usage and /models endpoints at startup and periodically on its own background refresh schedule. The router never reads raw status files or executes bulk scraping scripts inline.", "114": "The Extractor Subsystem acts as the data foundation for the rest of Token Buffet's core architecture: ```text ┌──────────────────────────────────────────────────────────┐ │                  Vendor CLI (TUI / PTY)                  │ └────────────────────────────┬─────────────────────────────┘ │ (Background /usage & /models) ▼ ┌──────────────────────────────────────────────────────────┐ │      Extractor Subsystem (src/tokenbuffet/extractors)    │ └────────────────────────────┬─────────────────────────────┘ │ (Asynchronous JSON Exports) ▼ ┌──────────────────────────────────────────────────────────┐ │         Cached Exports (data/providers_status/)          │ │   • <provider>_usage.json       • <provider>_models.json │ └──────────────┬────────────────────────────┬──────────────┘ │                            │ ▼                            ▼ ┌──────────────────────────────┐ ┌─────────────────────────┐ │ Smart Router Gateway (:8090) │ │ Control Center (:8080)  │ │  • Usage-mode load balancing │ │  • Quota gauges & resets│ │  • Model tier resolution     │ │  • Health status dots   │ └──────────────────────────────┘ └─────────────────────────┘ ```", "115": "By providing canonical remaining_pct metrics across all active subscription accounts, the subsystem powers the Smart Router's Usage Mode. The router sorts eligible backends by remaining headroom and routes incoming traffic to whichever subscription currently has the highest available capacity.", "116": "The single-page dashboard at port 8080 reads directly from data/providers_status/ to render visual quota gauges, reset countdowns, service status dots (green/amber/red), and model availability tables. This keeps the operator dashboard responsive and decoupled from CLI execution details.", "117": "The Control Center Dashboard at `http://127.0.0.1:8080` shows what each subscription has left, whether each service is running, and what requests have recently passed through the router. It reads the files the proxies and extractor export, and never shows prompt or response text.", "118": "Home shows the remaining quota percentage and reset time per provider period, sorted by each provider's tightest remaining quota. A missing export is shown as unknown. The figures come from `usage.limits.<period>.remaining_pct` in each `<provider>_usage.json`.", "119": "Each proxy publishes its bound port and state (`starting`, `running`, `failed`, `stopped`) to `<provider>_run_status.json`, along with a usage state of `reading`, `ready`, or `unavailable`. The dashboard turns these into status dots and a hero line such as \"All systems go\", with a one-click \"Start everything\" button.", "120": "The Activity tab parses per-provider session logs at `logs/<provider>/proxy/sessions/req_*.log` and correlates request ids with router records. It shows timestamps and outcomes, and marks the app as unknown when the client sends no identifying header. Full payloads are written only when Debug logging is on, and are not shown in the page.", "121": "A single header switch reveals process ids, live ports, launch, stop and restart buttons, provider tool checkboxes (`tools.enabled`), the Router tab with mode, `custom_order`, and tier model ids, and the Activity tab. Provider tool changes need a proxy restart, and router changes need a router restart.", "122": "Usage and model data come from the extractor, which captures each vendor CLI's TUI screens and parses them with configured regexes, as described under Core Architecture.", "123": "In the architecture of the Token Buffet AI Subscription Hub, Service Status provides real-time operational visibility into active process states, bound network ports, and overall system health across the bridge. Because Token Buffet operates as a multi-process bridge—coordinating the Smart Router Gateway (Port 8090), the Control Center Dashboard (Port 8080), and individual LLM Provider CLI Proxies (Ports 8000–8003+)—monitoring live port bindings and process states is essential for reliable prompt routing and non-disruptive process management. Below is an in-depth breakdown of what the sources specify regarding live port tracking, process state lifecycle management, router integration, and dashboard visualization.", "124": "To adhere to Token Buffet’s decoupled, config-driven design ethos, the Control Center Dashboard does not hardcode proxy port numbers or execute intrusive screen-scraping scripts to check service health. Instead, it relies on lightweight, filesystem-based status exports:", "125": "Whenever an individual CLI proxy process initializes, it publishes its live operational state to disk at data/providers_status/<provider>_run_status.json.", "126": "The file contains a JSON payload specifying the exact loopback port bound by the proxy (e.g., {\"port\": 8000}).", "127": "The system tracks four explicit lifecycle states for each proxy component: starting: The proxy process has spawned and is binding its port. running: The proxy is actively listening on its assigned port. failed: The proxy failed to start, for example because of a port conflict. stopped: The proxy process was cleanly terminated or killed by an operator or system signal.", "128": "The dashboard tracks system Process IDs (PIDs) alongside run-status files to allow targeted process management (such as launching, stopping, or killing specific proxies).", "129": "Live port and process status tracking directly drives the fault-tolerance logic of the Smart Router Gateway (Port 8090):", "130": "The router enforces a strict rule: it only dispatches client prompts to a provider that is explicitly marked as running AND whose bound port is actively listening on the loopback interface.", "131": "After binding its port, each proxy reads its usage in a background thread. If a vendor CLI displays an unexpected screen (e.g., a mandatory CLI update prompt) without returning quota metrics, the read fails and the proxy logs the captured reason and reports usage state unavailable.", "132": "When a provider status is marked as failed or stopped, the Smart Router automatically skips that provider during model selection in both Usage Mode and Custom Mode.", "133": "If a proxy process is forcibly terminated (leaving behind a stale _run_status.json file on disk), the router checks whether the port is actively listening before attempting a connection, preventing client requests from hanging on dead sockets.", "134": "The tbuffet start fleet launcher waits for all proxy startups to complete before launching the router, ensuring the router's initial model snapshot accurately reflects all currently running providers.", "135": "The Control Center Dashboard (http://127.0.0.1:8080) translates backend process states and port bindings into visual status displays using a Progressive Disclosure user experience: ```text ┌─────────────────────────────────────────┐ │     Dashboard Home (http://127.0.0.1:8080) │ └────────────────────┬────────────────────┘ │ ┌──────────────────────────┴──────────────────────────┐ ▼                                                     ▼ [ Basic Surface (Default) ]                          [ Advanced Mode (`body.adv`) ] • High-level Hero Status (\"All systems go\")          • Full Fleet Component Table (Ports, PIDs) • Color-coded Health Dots (🟢 / 🟡 / 🔴)             • Individual Launch / Kill / Login Controls • One-click \"Start everything\" button                • Router Restart & Polling Intervals (:8090) • Quota Headroom Gauges (% left)                     • Live Request Logs & Raw JSON Editors ```", "137": "Displays component readiness using universal color-coded indicators: 🟢 Green (up / ready / connected), 🟡 Amber (needs attention / login required / low quota), 🔴 Red (down / error / failed), and ⚪ Grey (disabled / unknown).", "138": "Displays top-level status lines such as \"● All systems go\" or \"✓ All services online (providers + gateway)\" alongside a single \"Start everything\" button. Advanced Mode (body.adv): Toggling the \"Advanced mode\" header switch morphs the interface into an operator console that exposes complete fleet process details.", "139": "Displays a structured matrix showing every component (router, dashboard, claude, codex, grok, agy), its configured port (config.server.port), its live bound port from _run_status.json, its active PID, and its current state.", "140": "Provides individual Launch (spawns proxy on default port), Kill (terminates PID), Login (opens terminal authentication), and Restart Router buttons.", "141": "Because Token Buffet operates across both Windows and macOS environments, process state management adapts to the underlying host operating system:", "142": "Uses native Windows process commands and the tbuffet start, start-provider, and start-router commands to spawn, monitor, and terminate process trees. macOS Process Isolation (src/tokenbuffet/platforms/macos/): processes.py: Uses the psutil library to verify service command lines and cleanly stop process trees, avoiding Linux /proc assumptions that fail on macOS. terminal.py: Uses AppleScript to launch interactive provider login sessions and chatbot workspaces inside visible Apple Terminal windows, passing environment variable overrides while tracking process IDs cleanly.", "143": "The dashboard exposes endpoint controls (GET /api/state, POST /api/providers/launch, POST /api/providers/stop, POST /api/providers/login) that handle process lifecycle events and return structured success or failure toasts back to the web interface.", "144": "In the Token Buffet AI Subscription Hub, Usage Gauges represent the visual and data-driven mechanisms on the Control Center Dashboard (http://127.0.0.1:8080) that display the remaining usage capacity (remaining_pct) and reset countdowns across all connected CLI subscription accounts. In the broader context of Monitoring & Dashboard design, Usage Gauges serve as the critical bridge between raw CLI status extraction and intelligent prompt dispatching across vendor subscriptions.", "145": "On the Dashboard's Home surface (\"See what you have left\") and the LLM Providers panel, remaining account capacity is rendered as horizontal percentage bars rather than raw token counts or unparsed CLI logs:", "146": "Displays the canonical remaining quota percentage (e.g., 99.87%, 84%, 68%, or 12%) for each provider period (such as 5-hour, daily, or weekly limits).", "147": "Shows clear reset schedules (e.g., \"resets Oct 27, 10:59am\" or \"Resets Refreshes in 36m\") so operators know exactly when exhausted quotas will replenish.", "148": "Depleted quotas (remaining_pct <= 0), missing status exports (N/A), or unauthenticated CLI sessions trigger amber/red status indicators (such as ⚠ Quota depleted or ⚠ Not logged in), making account issues unmissable.", "149": "Gauges on the Home view are dynamically sorted by each account's tightest remaining capacity, giving operators an instant glance at which accounts have the most room.", "150": "Usage Gauges do not execute slow, inline screen-scraping when a user opens the dashboard or submits an API request:", "151": "The Extractor Subsystem spawns background pseudo-terminal (PTY) tasks or subcommands to issue status commands (such as /usage) directly inside interactive vendor CLIs.", "152": "Extracted metrics are saved asynchronously to disk as JSON status files at data/providers_status/<provider>_usage.json.", "153": "Within the status JSON, the metric usage.limits.<named-period>.remaining_pct serves as the single source of truth for quota calculations, with used_pct stored as its complement.", "154": "Individual proxies serve their usage status via GET /usage endpoints with a default cache lifetime of 1,800 seconds (30 minutes). The router polls these endpoints on a schedule, while the dashboard reads the exported status files, ensuring live prompt execution remains fast and responsive.", "155": "Beyond providing visual monitoring for operators, the underlying data powering the Usage Gauges directly drives the Smart Router Gateway (Port 8090): ```text ┌────────────────────────────────────────────────────────┐ │     Vendor CLIs (Claude, Codex, Grok, Antigravity)     │ └───────────────────────────┬────────────────────────────┘ │ (Background /usage Extraction) ▼ ┌────────────────────────────────────────────────────────┐ │   data/providers_status/<provider>_usage.json Exports  │ └─────────────┬────────────────────────────┬─────────────┘ │                            │ ▼                            ▼ ┌───────────────────────────┐ ┌──────────────────────────┐ │ Control Center Dashboard  │ │ Smart Router Gateway     │ │ (:8080)                   │ │ (:8090)                  │ │ • Visual Quota Gauges     │ │ • Usage Mode Load Balancer│ │ • Reset Countdowns        │ │ • Auto-Skips Depleted    │ └───────────────────────────┘ └──────────────────────────┘ ```", "156": "When downstream applications (such as Obsidian, Brave Leo, Raycast, or Claudia) send prompts to port 8090 using abstract semantic performance tiers (fast, medium, reasoning), the router operates in Usage Mode by reading these exact remaining_pct metrics.", "157": "Prompts are automatically dispatched to whichever connected provider currently holds the highest remaining quota headroom, spreading workload across subscriptions without paying per-token API bills.", "158": "Providers whose Usage Gauges report remaining_pct <= 0 or offline states are automatically bypassed in favor of alternative backends supporting the requested tier.", "159": "In the architecture of the Token Buffet AI Subscription Hub, Advanced Mode serves as the opt-in operator surface within the Control Center Dashboard (http://127.0.0.1:8080). Adhering to a Progressive Disclosure UX design (\"Progressive Hub\"), the dashboard remains simple and uncluttered by default for everyday users, displaying hero status lines, visual quota gauges, and one-click app launchers. Toggling the \"Advanced mode\" switch in the header adds the body.adv CSS class, revealing deep technical controls, raw configuration editors, process details, Provider Tools, and complete Router Configuration panels.", "160": "On the LLM Providers / Accounts panel, Advanced Mode grants operators direct control over which client capabilities and agentic tool integrations are exposed to each backend CLI.", "161": "For each discovered provider (Claude, Codex, Grok, Gemini Antigravity), Advanced Mode renders a card displaying its model catalog and available tools. Operators manage tool access via interactive checkboxes (such as Bash, Edit, Read, WebSearch). Checking or unchecking these tools writes directly to tools.enabled inside registered_providers/<provider>/config.json. Notably, tools.enabled is the only field in the provider definition file that the dashboard ever modifies on disk.", "162": "Because running proxy processes hold CLI execution settings in memory, any edits made to provider tools require a proxy restart to take effect.", "163": "Provider definitions can also specify execution.tool_handoff_args (such as passing --tools \"\" for Claude Code and Grok Build). This instructs the backend CLI engine to generate a structured tool-choice decision while leaving actual tool execution safely in the hands of the downstream client workspace.", "164": "While the basic surface collapses routing strategy into a simple plain-language choice (\"Spread work across accounts\" vs. \"Always use my best account first\"), Advanced Mode unveils the full Routing panel for precise control over prompt dispatching. The Routing panel reads and edits config/router_config.json across three core dimensions:", "166": "Operates as a load-balancing strategy that uses the remaining_pct metrics the router polls from each running proxy's /usage endpoint and automatically routes prompts to whichever active backend currently holds the highest available quota headroom.", "167": "Bypasses quota equalization and directs prompts strictly according to a hardcoded provider preference sequence.", "168": "Operators can drag or reorder an interactive provider priority list (e.g., [\"claude\", \"codex\", \"agy\", \"grok\"]). In Custom Mode, the gateway evaluates candidate backends top-to-bottom, advancing to the next provider only if a higher-ranked backend is offline, depleted (remaining_pct <= 0), or rate-limited.", "169": "Displays and allows customization of the frozen mapping that translates abstract client performance tiers (fast / Quick, medium / Balanced, reasoning / Best) into exact vendor model IDs (e.g., mapping reasoning to gemini-3.1-pro-high, Opus, GPT-6-Astra, or grok-4.7). The Startup Snapshot & Restart Rule When router settings are saved, config/router_config.json is updated on disk immediately. However, running router instances retain a startup snapshot of configuration state to prevent mid-session routing drift. The dashboard explicitly flags this with an in-situ banner (\"Changes apply after a router restart\") and provides a one-click \"Restart router\" button to apply updates instantly.", "170": "| Dashboard Feature | Basic Surface (Everyday User) | Advanced Mode (Operator / Tinkerer) | | --- | --- | --- | | UX Target | Calm, card-based overview; zero technical jargon. | Dense body.adv table view exposing ports, PIDs, and logs. | | Provider Management | Status dots (🟢/🟡/🔴), quota gauges, and \"Log in\" buttons. | Sandbox toggles, model re-scraping, and Tools checkboxes (tools.enabled). | | Router Controls | Hidden or shown as a single plain toggle (Spread work vs. Use best first). | Full custom_order drag list, tier-to-model pinning, and router restart triggers. | | App Management | Add-an-App 3-step wizard and one-click \"Re-apply\" buttons. | Raw JSON editors for app_meta.json, app_settings.json, and vault_types.json. |", "171": "In the architecture of the Token Buffet AI Subscription Hub, the Activity Feed (Session Request Logs) serves as the operational audit log and request-tracing surface within the Control Center Dashboard (http://127.0.0.1:8080). While Usage Gauges track account capacities and Service Status monitors process health, the Activity Feed tracks individual AI prompts as they flow through the system. It allows operators to trace request lifecycles across client apps, the Smart Router gateway, and backend CLI proxies without compromising user privacy.", "172": "The Activity Feed does not rely on active database connections or external log aggregators. Adhering to Token Buffet's file-based, config-driven ethos, it dynamically parses per-provider session logs stored on disk:", "173": "Reads log files located in logs/<provider>/proxy/sessions/req_*.log.", "174": "Log filenames encode metadata directly into their title structure: req_<provider>_<YYYYMMDD>_<HHMMSS>_<reqid>.log For example, req_claude_20261011_204213_6b959df8.log identifies the target provider, precise timestamp, and unique request ID.", "175": "To determine request outcomes without heavy parsing, the dashboard inspects body markers inside the session log:", "176": "→ Completed / OK", "179": "Both router and CLI proxy consoles emit synchronized REQUEST, FAIL, and DONE summary lines sharing the exact same request ID. Provider error messages are whitespace-normalized and capped at 500 characters to prevent console spam.", "180": "A core design principle of Token Buffet's Activity Feed is strict prompt and response privacy:", "181": "By default, the Activity page displays no prompt text or response body content. Operators can see that a request occurred, which provider handled it, and whether it succeeded, but cannot read the user's private text.", "182": "Full request/response payloads (containing system prompts, user inputs, and model outputs) are recorded only when Debug logging is explicitly enabled. These raw JSON payloads are written to isolated files at logs/<provider>/proxy/raw_requests/req_<provider>_<ts>_<id>.json for local debugging and are never rendered on the web dashboard surface.", "183": "The Activity Feed adapts its presentation based on the dashboard's Progressive Disclosure UX model (Progressive Hub): ```text ┌─────────────────────────────────────────┐ │     Control Center Dashboard (:8080)    │ └────────────────────┬────────────────────┘ │ ┌──────────────────────────┴──────────────────────────┐ ▼                                                     ▼ [ Basic Surface (Default) ]                          [ Advanced Mode (`body.adv`) ] • Plain-English Activity Items                       • Live `router.log` Tailing • \"Obsidian asked Claude · 2m ago · ok\"              • Interactive Log File Filtering • Zero Technical Jargon                              • Raw Session File Inspection Basic Surface (Everyday User): Translates request logs into plain-language activity cards (e.g., \"Obsidian asked Claude · 2m ago · ok\"). ``` Advanced Mode (body.adv): Turning on the \"Advanced mode\" header toggle unlocks the full Activity operator tab:", "184": "Enables live tailing of router.log stream lines.", "185": "Allows operators to filter requests by provider or status and open raw log files directly from the interface.", "186": "When downstream software makes a request to port 8090, the router attempts to identify which client application initiated the call:", "187": "If a client application supplies an identifying user-agent or client header, the Activity Feed labels the request with the application name (e.g., Obsidian, Brave Leo, Claudia).", "188": "If a downstream client does not provide identification headers, the dashboard marks the app attribution as \"unknown\" rather than guessing or mislabeling the traffic source.", "189": "The Smart Router (port 8090) decides which subscription answers each request. Routing happens in two steps: resolve the requested model to a tier and its candidate backends, then choose among the backends by routing mode.", "191": "Light autocomplete, tag extraction, and ingestion.", "192": "Standard chat, drafting, and daily note synthesis.", "193": "Complex reasoning, multi-document analysis, and deep synthesis. Each provider's `config.json` holds a regex per tier. The first time a running proxy's models are readable, the router matches the regexes and freezes the newest matching exact model ids into `config/router_config.json`, with a default effort per tier. Hand edits to that file win.", "194": "A request is resolved by tier, then exact model id, then provider name, then fuzzy match, and finally falls back to the medium tier. If no medium fallback exists the router returns a structured HTTP 503.", "196": "Picks the backend with the most remaining quota, skipping depleted (`remaining_pct <= 0`), stopped, or offline backends.", "197": "Follows the global `custom_order` preference list, for example claude, codex, agy, grok.", "198": "Provider failures, connection failures, HTTP 429, and explicit error events before streaming advance to the next candidate. When a request carries client tools, the router asks a backend CLI for one structured tool-call decision and returns it to the client, which executes the tool itself. Claude and Grok configs pass `--tools \"\"` for this.", "199": "The dashboard's Router tab edits the mode, `custom_order`, and tier model ids. A running router keeps its startup snapshot, so saved changes apply after a router restart.", "200": "In the architecture of the Token Buffet AI Subscription Hub, Semantic Tiers (fast, medium, reasoning) form the foundational abstraction layer used by the Smart Router Gateway (Port 8090). Because flat-rate command-line interface (CLI) subscriptions—such as Claude Code, Codex CLI, Grok Build, and Gemini Antigravity—do not issue traditional per-token developer API keys, downstream software applications are decoupled from specific vendor model strings (like claude-3-5-sonnet or grok-4.7). Instead, client applications issue requests using generic performance tiers. The router translates these requests into concrete vendor models and dynamically balances the workload across connected subscriptions based on available quota headroom. Below is an in-depth breakdown of what the sources specify regarding the definition, resolution, load balancing, per-task assignment, and operator management of semantic tiers.", "201": "The router exposes three primary performance tiers, which correspond to clear plain-language labels across the system's user interfaces: fast (Plain Language: \"Quick\"): Tailored for high-frequency, low-latency, lightweight background tasks such as text autocomplete, document ingestion, and tag extraction. medium (Plain Language: \"Balanced\"): The default baseline tier suited for general chat sessions, standard drafting, daily note synthesis, and routine summarization. reasoning (Plain Language: \"Best\"): Reserved for heavy compute operations, multi-document analysis, periodic vault linting, deep knowledge synthesis, and complex problem-solving.", "202": "The router resolves incoming tier requests to concrete vendor CLI models using a multi-stage configuration structure:", "203": "Each provider configuration (registered_providers/<provider>/config.json) defines regex patterns under its tiers object that match its supported CLI models (e.g., mapping fast to build-fast$, medium to grok-4\\\\.6, and reasoning to grok-4\\\\.7$). Centralized Router Map (router_config.json): The router matches these regexes once against each running proxy's /models endpoint and freezes the newest matching exact model IDs per provider in config/router_config.json. For example, the reasoning tier maps across connected backends to specific model IDs such as Gemini Antigravity (gemini-3.1-pro-high), Claude (Opus), Codex (GPT-6-Astra), and Grok (grok-4.7).", "204": "When an incoming API request reaches port 8090, the router attempts model resolution in the following sequence: Exact Semantic Tier (fast, medium, or reasoning) Exact Model ID Match Provider Name Match Fuzzy Model Match Fallback to medium Tier If a request cannot be mapped and no medium fallback exists, the router returns a structured HTTP 503 error.", "205": "Once a tier is selected, the router chooses which specific backend provider handle the prompt based on the active routing mode:", "206": "\"usage\"): The router uses the remaining-quota figures it polls from each running proxy's /usage endpoint, which the proxies obtain asynchronously from the background extractor subsystem. It ranks all running backends supporting the requested tier by their canonical remaining usage capacity percentage (remaining_pct) and routes the prompt to whichever provider holds the highest available quota headroom.", "207": "\"custom\"): Bypasses remaining quota percentages and adheres strictly to a user-defined provider preference list (custom_order, e.g., [\"claude\", \"codex\", \"agy\", \"grok\"]). Prompts hit the first available provider in the list; the router only advances down the sequence if the primary provider is offline, stopped, depleted (remaining_pct <= 0), or encounters a pre-stream execution error.", "208": "Semantic tiers enable a universal integration method across downstream bring-your-own-endpoint (BYOM) software: Universal Configuration Rule for Routable Apps Any application supporting custom OpenAI base URLs or Ollama hosts can connect in three steps:", "209": "Point to http://127.0.0.1:8090 (Ollama host) or http://127.0.0.1:8090/v1 (OpenAI format).", "210": "Enter fast, medium, or reasoning.", "211": "Use any placeholder string (e.g., ollama). Per-Task Model Routing in Client Applications", "212": "The karpathywiki plugin uses per-task smart levels (usePerTaskModels: true) to assign different semantic tiers to distinct background operations within the vault (ingestModel: \"fast\", lintModel: \"reasoning\", queryModel: \"reasoning\").", "213": "Remaps ANTHROPIC_BASE_URL in .claude/settings.local.json to port 8090, translating Claude Code's requested models directly to Token Buffet's tiers (opus → reasoning, sonnet → medium, haiku → fast).", "214": "Applications like Brave Leo, Raycast, Home Assistant, Joplin, Logseq, Thunderbird (Ollama Compose), AnythingLLM, and Open WebUI map their chat or completion features directly to these three tiers.", "215": "The single-page operator console served on port 8080 provides full administrative visibility over semantic tiers:", "216": "Operators can switch between Usage Mode (\"Spread work across accounts\") and Custom Mode (\"Always use my best account first\").", "217": "Under Advanced Mode, operators can inspect and edit the tier-to-model mappings directly in router_config.json or re-populate them from provider regexes.", "218": "Because active router instances retain a startup snapshot of tier mappings to prevent mid-session configuration drift, the dashboard displays a banner reminding operators that routing edits require a router process restart to take effect.", "219": "In the larger context of Smart Routing & Tiers within the Token Buffet AI Subscription Hub, Usage Mode (\"mode\": \"usage\") serves as the primary, quota-aware load-balancing engine for the Local Router Gateway (port 8090). Rather than sending all prompt traffic to a single fixed AI provider, Usage Mode dynamically inspects the remaining usage capacity across all connected subscription accounts and routes incoming requests to whichever backend currently holds the highest available quota headroom. Below is an in-depth breakdown of how Usage Mode operates, its interaction with semantic tiers, its underlying data sources, and its representation across the operator interface.", "221": "In Usage Mode, the router ranks all active, running backend providers supporting a requested tier by their canonical remaining quota percentage (remaining_pct) and selects the provider with the most headroom.", "222": "The primary value proposition for users is the ability to \"spread work across accounts\". By distributing requests across multiple subscription CLIs (such as Claude Code, Codex CLI, Grok Build, and Gemini Antigravity), users avoid unexpected rate limits on any single account without paying per-token API fees or buying separate developer keys.", "223": "Usage Mode contrasts directly with Custom Mode (\"mode\": \"custom\"), which ignores remaining quota levels and strictly adheres to a hardcoded preference order (custom_order, e.g., prioritizing Claude before falling back to Codex or Grok).", "224": "Usage Mode operates as the second step in Token Buffet’s two-stage routing pipeline:", "225": "Client applications submit requests using abstract performance tiers—fast (Quick), medium (Balanced), or reasoning (Best)—rather than hardcoded model IDs. The router translates the requested tier into a list of candidate vendor models defined in config/router_config.json (for example, mapping reasoning across Gemini Antigravity, Claude Opus, Codex GPT-6, and Grok-4.7).", "226": "Once the eligible providers for that tier are identified, Usage Mode evaluates their live usage exports, sorts the candidates by remaining_pct from highest to lowest, and dispatches the prompt to the top-ranked provider.", "227": "Usage Mode automatically bypasses backends that are stopped, offline, or depleted (remaining_pct <= 0). If the selected backend encounters an error, rate limit (HTTP 429), or CLI connection failure before text generation starts, the router advances seamlessly to the provider with the next-highest remaining quota within that tier.", "228": "To ensure that quota evaluation never adds latency to live API requests, Usage Mode relies on a decoupled data pipeline:", "229": "Individual CLI proxies manage background pseudo-terminal (PTY) or subcommand tasks that run vendor status commands (such as /usage) to capture remaining quota metrics.", "230": "Extracted metrics are written asynchronously to disk under data/providers_status/<provider>_usage.json. The canonical sorting field is usage.limits.<named-period>.remaining_pct.", "231": "The Smart Router on port 8090 never executes screen-scraping scripts inline during a request. Instead, it polls each active proxy's /usage endpoint on a background schedule (defaulting to every 30 minutes), keeping prompt routing fast and responsive.", "232": "Usage Mode is fully integrated into the Control Center Dashboard (port 8080):", "233": "On the Dashboard Home surface and Accounts cards, quota availability is displayed as visual gauges sorted by tightest remaining capacity, reflecting the same quota hierarchy used by Usage Mode.", "234": "Under the Routing panel in Advanced Mode, operators can toggle between \"Spread work across accounts (save quota)\" (usage) and \"Always use my best account first\" (custom).", "235": "The dashboard explicitly notes that toggling routing modes rewrites config/router_config.json, which requires a router process restart to take effect because active router instances retain a startup snapshot of configuration state.", "236": "In the larger context of Smart Routing & Tiers within the Token Buffet AI Subscription Hub, Custom Mode (\"mode\": \"custom\") serves as the preference-driven load-balancing strategy for the Local Router Gateway operating on port 8090 While Usage Mode automatically spreads prompt traffic to whichever backend currently holds the highest remaining quota percentage, Custom Mode allows users to bypass quota-equalization logic and direct prompts strictly according to a hardcoded provider preference sequence known as custom_order.", "238": "Under Custom Mode, the router evaluates candidate providers based on an ordered array in config/router_config.json (such as custom_order: [\"claude\", \"codex\", \"agy\", \"grok\"]). \"Use Best First\" Philosophy: In user-facing interfaces like the Control Center Dashboard (port 8080), Custom Mode is represented in plain language as \"Always use my best account first\" or \"Use best first\".", "239": "Custom Mode is designed for users or operators who prioritize specific model capabilities or vendor preferences (e.g., always preferring Claude Opus or GPT-6 whenever available) and only want to utilize secondary providers when the primary choice is depleted, offline, or rate-limited.", "240": "Custom Mode functions as the second phase of Token Buffet's prompt dispatch workflow: ```text [ Client Request ] ──▶ (Port 8090) ──▶ Stage 1: Resolve Semantic Tier ('fast', 'medium', 'reasoning') │ ▼ Stage 2: Custom Mode (Evaluate 'custom_order': #1 Claude ➔ #2 Codex ➔ #3 Agy ➔ #4 Grok) │ ▼ Dispatch to First Eligible Backend ```", "241": "Client applications submit requests specifying abstract tiers (fast / Quick, medium / Balanced, reasoning / Best) or vendor model IDs. The router maps the requested tier to candidate models across all registered backends defined in router_config.json.", "242": "Instead of checking and sorting providers by headroom (remaining_pct), Custom Mode iterates through custom_order from top to bottom. The router checks whether the first-preference provider supports the requested tier, is actively running (run_status = running on its assigned port), and has available quota (remaining_pct > 0).", "243": "If the top-ranked provider is healthy, the prompt is immediately dispatched to its proxy process.", "244": "Custom Mode enforces multi-tiered error handling to ensure client requests do not drop if a preferred provider is unavailable:", "245": "Providers marked as stopped, offline, or depleted (remaining_pct <= 0) are automatically skipped in the sequence.", "246": "If the primary provider in custom_order encounters a connection failure, an HTTP 429 rate limit, or a CLI execution error before text generation starts, the router advances down the custom_order list to the next candidate provider in the tier.", "247": "Non-streaming API requests are buffered in memory and spooled to disk if payload sizes exceed 1 MiB. This guarantees that if a preferred backend fails during execution, the router retries the full prompt cleanly on the next provider in custom_order without partial payload corruption.", "248": "If every provider listed in custom_order for a given tier is offline, depleted, or returns an error, the router returns an HTTP 503 service unavailable response.", "249": "Operators manage Custom Mode through the Control Center Dashboard running on port 8080:", "250": "Located under the Router tab (revealed via the header \"Advanced mode\" toggle), operators can switch the system mode between \"Spread work across accounts (save quota)\" (usage) and \"Always use my best account first\" (custom). custom_order Drag & Reorder List: The dashboard provides an interactive list allowing operators to reorder provider priority (e.g., moving claude to #1 or grok to #2).", "251": "Whenever routing mode or custom_order edits are saved, config/router_config.json is updated on disk. The dashboard displays an explicit restart-required banner becaus

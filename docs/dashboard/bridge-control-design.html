const initial=window.openai?.widgetState;

const headroom=a=>{const values=Object.values(a.limits).filter(v=>v&&Number.isFinite(v.remaining_pct)).map(v=>v.remaining_pct);return values.length?Math.min(...values):null;};

const usable=(p,a)=>p.enabled&&a.enabled&&a.ready&&(headroom(a)===null||headroom(a)>0);

const accountRank=(p,a)=>a&&usable(p,a)?(headroom(a)??-1):-2;

const sortedAccounts=p=>[...p.accounts].sort((a,b)=>accountRank(p,b)-accountRank(p,a));

const sortedProviders=()=>[...providers].sort((a,b)=>accountRank(b,sortedAccounts(b)[0])-accountRank(a,sortedAccounts(a)[0]));

const accountState=(p,a)=>!a.ready?['Login needed','b-warn']:headroom(a)!==null&&headroom(a)<=0?['Quota depleted','b-depleted']:!p.enabled?['Provider excluded','b-neutral']:!a.enabled?['Account excluded','b-neutral']:!s.running?['Paused','b-neutral']:headroom(a)!==null&&headroom(a)<20?['Running low','b-warn']:['Connected',''];

const button=(label,action,data='',primary=false)=>'<button type="button" class="b-button cursor-interaction '+(primary?'b-primary':'')+'" data-action="'+action+'" '+data+'>'+label+'</button>';

const tag=(label,tone='')=>'<span class="b-tag '+tone+'"><span class="b-dot"></span>'+label+'</span>';

function save(){const prefs={advanced:s.advanced,theme:s.theme,tab:s.tab};try{localStorage.setItem('bridge-design-preferences',JSON.stringify(prefs))}catch{}window.openai?.setWidgetState?.({modelContent:{design:'Progressive Hub',view:s.tab,advanced:s.advanced,routingPreference:s.route},privateContent:prefs}).catch(()=>{});}

function tell(t){s.message=t;const el=root.querySelector('#bridge-toast');el.textContent=t;el.hidden=!t;}

function quota(p,a){return '<div class="b-limit-list">'+Object.entries(a.limits).map(([period,v])=>{

 const known=v&&Number.isFinite(v.remaining_pct),q=known?Math.max(0,Math.min(100,v.remaining_pct)):null;

 return '<div class="b-period"><div class="b-quota-head"><span>'+esc(period)+' left</span><strong>'+(known?q+'%':'Unknown')+'</strong></div>'+(known?'<div class="b-meter '+(q<=0?'b-empty-meter':q<20?'b-low':'')+'" role="meter" aria-label="'+esc(p.name+' '+a.name+' '+period+' quota remaining')+'" aria-valuenow="'+q+'" aria-valuemin="0" aria-valuemax="100"><span style="width:'+q+'%"></span></div><div class="b-reset">Resets '+esc(v.resets||'not reported')+'</div>':'<div class="b-reset b-unknown">Not reported</div>')+(Number.isFinite(v?.tokens_remaining)?'<div class="b-reset">'+v.tokens_remaining.toLocaleString()+' tokens available</div>':'')+'</div>';

 }).join('')+'</div>';}

function accountLine(p,a,controls=false){const state=accountState(p,a);return '<div class="b-account-line"><div class="b-account-identity"><strong>'+esc(a.name)+'</strong>'+tag(state[0],state[1])+(!a.ready?button('Log in','login','data-id="'+p.id+'" data-account="'+a.id+'"'):'')+'</div>'+quota(p,a)+(controls?'<div class="b-account-actions"><label class="b-toggle"><input type="checkbox" data-account-enable="'+a.id+'" data-provider="'+p.id+'" '+(a.enabled?'checked':'')+'>Use this account</label>'+(a.ready?button('Re-authenticate','login','data-id="'+p.id+'" data-account="'+a.id+'"'):'')+'</div>':'')+'</div>';}

function quotaRoster(){return '<div class="b-quota-roster">'+sortedProviders().map(p=>'<article class="b-roster-group" data-provider-group="'+p.id+'" aria-label="'+p.name+' quota"><div class="b-provider-identity"><span class="b-monogram">'+p.initial+'</span><div><h3>'+p.name+'</h3><span class="b-sub b-small">'+p.accounts.length+' account</span></div></div><div class="b-roster-accounts">'+sortedAccounts(p).map(a=>accountLine(p,a)).join('')+'</div></article>').join('')+'</div>';}

function accountCards(){return '<div class="b-provider-grid">'+providers.map(p=>'<article class="b-provider-card"><div class="b-between"><div class="b-account-name"><span class="b-monogram">'+p.initial+'</span>'+p.name+'</div>'+button('Provider settings','account-details','data-id="'+p.id+'"')+'</div><label class="b-toggle b-provider-switch"><input type="checkbox" data-enable="'+p.id+'" '+(p.enabled?'checked':'')+'>Use this provider in routing</label><div class="b-nested-accounts">'+p.accounts.map(a=>accountLine(p,a,true)).join('')+'</div></article>').join('')+'</div>';}

function attention(){const need=providers.flatMap(p=>p.accounts.filter(a=>p.enabled&&a.enabled&&(!a.ready||(headroom(a)!==null&&headroom(a)<=0))).map(a=>({p,a})));if(!need.length)return '';const {p,a}=need[0];return '<div class="b-notice"><div><h3>'+p.name+' · '+esc(a.name)+'</h3><p>'+(!a.ready?'This account needs a login. Other available accounts can still be used.':'This account has no quota left in one or more periods.')+'</p></div>'+(!a.ready?button('Log in','login','data-id="'+p.id+'" data-account="'+a.id+'"'):'')+'</div>';}

function top(eyebrow,title,desc,action=''){return '<div class="b-top"><div class="b-eyebrow">'+eyebrow+'</div><div class="b-between"><h1>'+title+'</h1>'+action+'</div><p>'+desc+'</p></div>';}

function appRows(home=false,filterType=null){const items=s.apps.map((a,i)=>({a,i})).filter(({a})=>!filterType||a.type===filterType);return '<div class="b-app-list">'+(items.length?items.map(({a,i})=>'<div class="b-app-row"><div class="b-app-icon">'+types.find(t=>t.id===a.type).glyph+'</div><div class="b-grow"><h3>'+esc(a.name)+'</h3><p class="b-sub">'+(filterType?(a.template?'Template: '+esc(a.template):'Connected workspace'):types.find(t=>t.id===a.type).name+(a.template?' · '+esc(a.template):''))+'</p></div><div class="b-row">'+tag(s.running?'Connected':'Paused',s.running?'':'b-neutral')+(home?'':button('Settings','app-details','data-index="'+i+'"'))+'</div></div>').join(''):'<div class="b-empty">No apps of this type connected yet.</div>')+'</div>';}

function appGroups(){return types.map(t=>{const count=s.apps.filter(a=>a.type===t.id).length;return '<section class="b-section" aria-label="'+esc(t.name)+' apps"><div class="b-section-head"><div><div class="b-eyebrow">App type</div><h2>'+esc(t.name)+'</h2></div><span class="b-sub b-small">'+count+' '+(count===1?'app':'apps')+'</span></div><p class="b-sub b-small" style="max-width:690px;margin-bottom:16px">'+esc(t.description)+'</p>'+appRows(false,t.id)+'</section>';}).join('');}

 '<section class="b-panel"><h2>Smart levels</h2><p class="b-sub b-small" style="margin-top:6px">Resolved model snapshot · view only</p><div class="b-review"><div><span>Quick <span class="b-sub">/ fast</span></span><span>Small, routine tasks</span></div><div><span>Balanced <span class="b-sub">/ medium</span></span><span>Everyday work</span></div><div><span>Best <span class="b-sub">/ reasoning</span></span><span>Complex reasoning</span></div></div><details><summary>Models available for Best</summary>'+s.order.map(id=>'<div class="b-order-row"><span class="b-grow">'+provider(id).name+'</span><span class="b-mono">'+provider(id).model+'</span></div>').join('')+'</details></section></div>'+

 if(stepName==='Name & folder')body='<h2>Give your app a home</h2><label class="b-field">App name<input id="bridge-app-name" value="'+esc(w.name)+'" placeholder="e.g. My research notes"><small>Each app needs a unique name.</small></label><label class="b-field">'+t.pathLabel+'<input id="bridge-app-path" value="'+esc(w.path)+'" placeholder="Choose your existing folder" readonly><small>The live version uses a local folder picker.</small></label>'+button('Use example folder','example-folder')+'<p class="b-sub b-small" style="margin-top:8px">This preview never reads or changes your folders.</p>';

 if(stepName==='Template')body='<h2>What will you use it for?</h2><p class="b-sub b-small" style="margin:8px 0 18px">Start with a template. You can change it later.</p><div class="b-two">'+t.templates.map(x=>'<button class="b-choice cursor-interaction" data-action="template" data-value="'+x+'" aria-pressed="'+(w.template===x)+'"><strong>'+x+'</strong><small>'+({'General notes':'A flexible starting point for your notes.','Finance conference':'People, organizations, and financial concepts.','Research papers':'Questions, evidence, and key findings.','Daily journal':'Ideas, reflections, and daily connections.'}[x])+'</small></button>').join('')+'</div>';

 if(stepName==='Review')body='<h2>Ready to connect</h2><dl class="b-review"><div><dt>App type</dt><dd>'+t.name+'</dd></div><div><dt>Name</dt><dd>'+esc(w.name)+'</dd></div><div><dt>Folder</dt><dd>'+esc(w.path)+'</dd></div>'+(w.template?'<div><dt>Template</dt><dd>'+esc(w.template)+'</dd></div>':'')+'</dl><p class="b-sub b-small">The live flow will copy the integration, prepare the workspace, and apply the settings. Each result appears here.</p>';

 return '<div class="b-wizard">'+top('My Apps','Connect an app','A few steps, then you’re ready.',button('Cancel','cancel-wizard'))+'<div class="b-steps">'+steps.map((x,i)=>'<div class="b-step '+(i<=w.step?'b-active':'')+'">'+(i+1)+'. '+x+'</div>').join('')+'</div><div class="b-panel">'+body+(w.error?'<div class="b-error" role="alert">'+esc(w.error)+'</div>':'')+'<div class="b-wizard-foot">'+(w.step?button('← Back','wizard-back'):'<span></span>')+button(stepName==='Review'?'Connect example app':'Continue →',stepName==='Review'?'wizard-finish':'wizard-next','',true)+'</div></div></div>';}

function confirmation(){if(!s.confirm)return '';const removing=s.confirm.kind==='remove';return '<div class="b-confirm" role="region" aria-label="Confirm '+(removing?'removal':'pause')+'"><h3>'+(removing?'Remove '+esc(s.apps[s.confirm.index].name)+' from AI Subscription Hub?':'Pause all AI connections?')+'</h3><p class="b-sub b-small" style="margin:6px 0 12px">'+(removing?'Your app and its documents stay in place. This removes its AI Subscription Hub registration.':'Connected apps will be unable to use AI Subscription Hub until you start it again.')+'</p><div class="b-row">'+button('Cancel','cancel-confirm')+button(removing?'Remove registration':'Pause everything','confirm','',true)+'</div></div>';}

function render(){root.querySelector('#bridge-advanced').checked=s.advanced;root.querySelector('#bridge-layout').classList.toggle('b-advanced',s.advanced);if(s.theme!=='auto')root.style.colorScheme=s.theme;else root.style.removeProperty('color-scheme');

const tabs=[['home','⌂','Home'],['apps','▦','My Apps'],['accounts','◉','LLM Providers'],...(s.advanced?[['routing','⇄','Router Configuration'],['activity','≋','Activity']]:[])];

nav.innerHTML=tabs.map(([id,icon,label])=>'<button class="cursor-interaction" type="button" data-action="tab" data-tab="'+id+'" '+(s.tab===id?'aria-current="page"':'')+'><span class="b-nav-glyph" aria-hidden="true">'+icon+'</span>'+label+'</button>').join('')+'<div class="b-side-foot"><strong><span class="b-dot" style="color:var(--b-accent)"></span> Your AI, connected</strong>Everyday simplicity.<br>Control when you need it.</div>';

main.innerHTML=confirmation()+(s.wizard?wizard():s.login?login():s.toolsProvider?accountDetail():s.detail!==null?appDetail():({home,apps,accounts,routing,activity}[s.tab]||home)());tell(s.message);}

function resetViews(){s.wizard=null;s.detail=null;s.login=null;s.toolsProvider=null;s.confirm=null;}

root.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;const d=el.dataset;

 if(a==='tab'){resetViews();s.tab=d.tab;s.message='';}

 if(a==='add'){resetViews();s.tab='apps';s.wizard={step:0,type:'obsidian',name:'',path:'',template:'General notes',error:''};}

 if(a==='cancel-wizard'){s.wizard=null;}

 if(a==='choose-type'){s.wizard.type=d.id;s.wizard.template=types.find(t=>t.id===d.id).templates[0]||'';}

 if(a==='example-folder'){s.wizard.path=s.wizard.type==='obsidian'?'C:/Example/My research notes':'C:/Example/My workspace';s.wizard.name=root.querySelector('#bridge-app-name').value|| (s.wizard.type==='obsidian'?'My research notes':'My workspace');}

 if(a==='template'){s.wizard.template=d.value;}

 if(a==='wizard-back'){s.wizard.step--;s.wizard.error='';}

 if(a==='wizard-next'){const w=s.wizard;w.error='';if(w.step===1){w.name=root.querySelector('#bridge-app-name').value.trim();w.path=root.querySelector('#bridge-app-path').value.trim();const normalize=x=>x.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');if(!w.name||!w.path)w.error='Add a name and choose the example folder to continue.';else if(!normalize(w.name))w.error='Use a name with letters or numbers.';else if(s.apps.some(x=>x.type===w.type&&normalize(x.name)===normalize(w.name)))w.error='An app with this name already exists. Choose a different name.';}if(!w.error)w.step++;}

 if(a==='wizard-finish'){const w=s.wizard;s.apps.push({name:w.name,type:w.type,path:w.path,template:w.template,levels:{ingest:'Quick',lint:'Best',query:'Best'}});s.wizard=null;tell('Example app connected. No files were read or changed.');}

 if(a==='app-details'){s.tab='apps';s.detail=Number(d.index);}

 if(a==='back-apps'){s.detail=null;s.tab='apps';}

 if(a==='reapply'){const app=s.apps[Number(d.index)];const tpl=root.querySelector('#bridge-app-template');if(tpl)app.template=tpl.value;root.querySelectorAll('[data-level]').forEach(i=>app.levels[i.dataset.level]=i.value);tell('Preview: settings applied to '+app.name+'. No app configuration was changed.');}

 if(a==='remove-confirm'){s.confirm={kind:'remove',index:Number(d.index)};}

 if(a==='pause-confirm'){s.confirm={kind:'pause'};}

 if(a==='cancel-confirm'){s.confirm=null;}

 if(a==='confirm'){if(s.confirm.kind==='remove'){s.apps.splice(s.confirm.index,1);s.detail=null;tell('Example registration removed.');}else{s.running=false;tell('Preview: connections paused.');}s.confirm=null;}

 if(a==='start'){s.running=true;tell('Preview: router and connected accounts started.');}

 if(a==='login'){resetViews();s.login={provider:d.id,account:d.account||'default'};}

 if(a==='cancel-login'){s.login=null;}

 if(a==='finish-login'){const p=provider(s.login.provider),ac=account(p,s.login.account);ac.ready=true;ac.pid=4600;if(headroom(ac)===null)ac.limits.Weekly={remaining_pct:88,resets:'in 4 days'};s.login=null;tell('Preview: '+p.name+' · '+ac.name+' is signed in. No provider was registered.');}

 if(a==='refresh'){tell('Sample usage refreshed. No provider was contacted.');}

 if(a==='account-details'){s.toolsProvider=d.id;s.tab='accounts';}

 if(a==='back-accounts'){s.toolsProvider=null;}

 if(a==='save-tools'){const p=provider(d.id);p.tools=[...root.querySelectorAll('[data-tool]:checked')].map(x=>x.dataset.tool);tell('Preview: '+p.name+' tools saved. The live service would require a restart.');}

 if(a==='refresh-models'){tell('Sample model snapshot is current in this preview.');}

 if(a==='route'){s.route=d.value;}

 if(a==='move'){const i=Number(d.index),j=i+Number(d.dir);[s.order[i],s.order[j]]=[s.order[j],s.order[i]];}

 if(a==='save-routing'){s.savedRoute=s.route;s.savedOrder=[...s.order];s.pending=true;tell('Preview: routing settings saved. Restart to apply them.');}

 if(a==='apply-routing'){s.activeRoute=s.savedRoute;s.pending=false;tell('Preview: router restarted with the saved settings.');}

 if(a==='restart'){const inp=root.querySelector('[data-port="'+d.id+'"]'),port=Number(inp.value);if(!Number.isInteger(port)||port<1024||port>65535){tell('Choose a port between 1024 and 65535.');return;}const collision=providers.some(p=>p.id!==d.id&&p.port===port)||port===8080||(d.id!=='router'&&port===11434);if(collision){tell('That port is already assigned to another component.');return;}tell('Preview: '+(provider(d.id)?.name||'Router')+' launch requested on port '+port+'. No process was started.');}

render();save();});

root.addEventListener('change',e=>{

 if(e.target.id==='bridge-advanced'){s.advanced=e.target.checked;if(!s.advanced&&['routing','activity'].includes(s.tab)){s.tab='home';resetViews();}render();save();}

 if(e.target.dataset.enable){provider(e.target.dataset.enable).enabled=e.target.checked;render();save();}

 if(e.target.dataset.accountEnable){account(provider(e.target.dataset.provider),e.target.dataset.accountEnable).enabled=e.target.checked;render();save();}

 if(e.target.dataset.sandbox){provider(e.target.dataset.sandbox).sandbox=e.target.checked;tell('Preview: provider sandbox '+(e.target.checked?'enabled':'disabled')+'. No live execution settings changed.');save();}

 if(e.target.id==='bridge-filter'){s.filter=e.target.value;render();save();}

});

root.querySelector('#bridge-theme').addEventListener('click',()=>{const dark=s.theme==='dark'||(s.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);s.theme=dark?'light':'dark';render();save();});

window.addEventListener('openai:set_globals',e=>{const p=e.detail?.globals?.widgetState?.privateContent;if(!p)return;s.advanced=!!p.advanced;s.theme=['light','dark','auto'].includes(p.theme)?p.theme:'auto';s.tab=['home','apps','accounts','routing','activity'].includes(p.tab)?p.tab:'home';if(!s.advanced&&['routing','activity'].includes(s.tab))s.tab='home';resetViews();render();});

render();

if(globalThis.Tweak){const design={corners:14,accent:'#4b56cc'};const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--b-radius',design.corners+'px');root.style.setProperty('--b-accent-fill',design.accent);}});tweak.addSlider(design,'corners',{label:'Card corners',min:4,max:22,step:2,unit:'px'});tweak.addColorPicker(design,'accent',{label:'Action color',reference:'--b-accent-fill'});}

})();

</script>

</div>



</body></html>
